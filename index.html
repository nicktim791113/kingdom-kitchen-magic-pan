<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8a65">
  <link rel="manifest" href="./manifest.json">
  <title>王國廚房：我的魔法平底鍋</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: #fff7d6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff7d6;
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    canvas {
      width: min(100vw - 24px, calc((100vh - 24px) * 16 / 9));
      height: min(100vh - 24px, calc((100vw - 24px) * 9 / 16));
      max-width: 100%;
      max-height: 100%;
      border: 4px solid #6d4c41;
      border-radius: 8px;
      background: #fff7d6;
      touch-action: none;
      box-shadow: 0 18px 44px rgba(89, 53, 31, 0.22);
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="王國廚房遊戲畫面"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const VIEW = { w: 960, h: 540 };
    const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    const state = {
      mode: "menu",
      time: 0,
      message: "今天做蘋果魔法湯",
      spoken: "",
      cuts: 0,
      cutFlash: 0,
      wash: 0,
      dirt: [
        { x: -28, y: -18, r: 9 },
        { x: 10, y: -28, r: 7 },
        { x: 30, y: 2, r: 8 },
        { x: -6, y: 20, r: 10 },
        { x: -36, y: 18, r: 6 }
      ],
      drag: null,
      apple: { x: 410, y: 315, r: 62 },
      pot: { x: 650, y: 292, w: 230, h: 138 },
      stir: { active: false, lastAngle: 0, travel: 0 },
      particles: [],
      mute: false
    };

    const hit = {
      start: { x: 350, y: 385, w: 260, h: 76 },
      order: { x: 620, y: 382, w: 210, h: 70 },
      again: { x: 350, y: 392, w: 260, h: 72 },
      mute: { x: 848, y: 24, w: 74, h: 48 }
    };

    const audio = {
      ctx: null,
      beep(freq = 540, duration = 0.08, type = "sine") {
        if (state.mute) return;
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.12, this.ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration + 0.02);
        } catch (error) {
          state.mute = true;
        }
      }
    };

    function resize() {
      canvas.width = VIEW.w * DPR;
      canvas.height = VIEW.h * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function speak(text) {
      if (state.mute || state.spoken === text || !("speechSynthesis" in window)) return;
      state.spoken = text;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-TW";
        utterance.rate = 0.86;
        utterance.pitch = 1.25;
        window.speechSynthesis.speak(utterance);
      } catch (error) {
        state.mute = true;
      }
    }

    function resetRound() {
      state.mode = "order";
      state.message = "小公主想喝蘋果魔法湯";
      state.cuts = 0;
      state.cutFlash = 0;
      state.wash = 0;
      state.apple = { x: 410, y: 315, r: 62 };
      state.drag = null;
      state.stir = { active: false, lastAngle: 0, travel: 0 };
      state.particles = [];
      state.spoken = "";
      speak("小公主想喝蘋果魔法湯。");
    }

    function setMode(mode, message) {
      state.mode = mode;
      state.message = message;
      state.drag = null;
      state.stir.active = false;
      if (mode === "wash") speak("幫蘋果洗一洗。");
      if (mode === "cut") speak("點一點蘋果，切成小塊。");
      if (mode === "cook") speak("把蘋果放進鍋鍋裡。");
      if (mode === "stir") speak("繞圈圈攪一攪。");
      if (mode === "reward") speak("完成了，好香喔。");
    }

    function posFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * VIEW.w / rect.width,
        y: (event.clientY - rect.top) * VIEW.h / rect.height
      };
    }

    function inRect(point, rect) {
      return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function spawnBurst(x, y, color = "#ffd54f", count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 170;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 45,
          life: 0.5 + Math.random() * 0.45,
          color,
          size: 4 + Math.random() * 6
        });
      }
    }

    function pointerDown(event) {
      const point = posFromEvent(event);
      if (inRect(point, hit.mute)) {
        state.mute = !state.mute;
        if (state.mute && "speechSynthesis" in window) window.speechSynthesis.cancel();
        return;
      }

      if (state.mode === "menu" && inRect(point, hit.start)) {
        audio.beep(520);
        resetRound();
        return;
      }

      if (state.mode === "order" && inRect(point, hit.order)) {
        audio.beep(640);
        setMode("wash", "把蘋果洗乾淨");
        return;
      }

      if (state.mode === "wash" && dist(point, state.apple) < 95) {
        state.drag = { type: "wash", last: point };
        audio.beep(420, 0.06, "triangle");
        return;
      }

      if (state.mode === "cut" && dist(point, state.apple) < 95) {
        state.cuts = Math.min(3, state.cuts + 1);
        state.cutFlash = 0.22;
        spawnBurst(state.apple.x + 32, state.apple.y - 28, "#ffecb3", 10);
        audio.beep(760 + state.cuts * 70, 0.07, "square");
        if (state.cuts >= 3) setTimeout(() => setMode("cook", "拖曳蘋果放進鍋鍋"), 700);
        return;
      }

      if (state.mode === "cook" && dist(point, state.apple) < 90) {
        state.drag = { type: "apple", dx: state.apple.x - point.x, dy: state.apple.y - point.y };
        audio.beep(480, 0.05);
        return;
      }

      if (state.mode === "stir") {
        const center = potCenter();
        if (dist(point, center) < 145) {
          state.stir.active = true;
          state.stir.lastAngle = Math.atan2(point.y - center.y, point.x - center.x);
          audio.beep(430, 0.05, "triangle");
        }
        return;
      }

      if (state.mode === "reward" && inRect(point, hit.again)) {
        audio.beep(660);
        resetRound();
      }
    }

    function pointerMove(event) {
      const point = posFromEvent(event);
      if (state.mode === "wash" && state.drag?.type === "wash") {
        const moved = dist(point, state.drag.last);
        if (dist(point, state.apple) < 105) {
          state.wash = Math.min(1, state.wash + moved / 360);
          if (moved > 2) spawnBurst(point.x, point.y, "#81d4fa", 1);
          if (state.wash >= 1) {
            spawnBurst(state.apple.x, state.apple.y, "#4fc3f7", 22);
            audio.beep(720, 0.12);
            setTimeout(() => setMode("cut", "點蘋果三下切小塊"), 240);
          }
        }
        state.drag.last = point;
        return;
      }

      if (state.mode === "cook" && state.drag?.type === "apple") {
        state.apple.x = point.x + state.drag.dx;
        state.apple.y = point.y + state.drag.dy;
        return;
      }

      if (state.mode === "stir" && state.stir.active) {
        const center = potCenter();
        const angle = Math.atan2(point.y - center.y, point.x - center.x);
        let delta = angle - state.stir.lastAngle;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        state.stir.travel += Math.abs(delta);
        state.stir.lastAngle = angle;
        if (Math.random() > 0.55) spawnBurst(point.x, point.y, "#fff176", 1);
        if (state.stir.travel >= Math.PI * 4.2) {
          spawnBurst(center.x, center.y - 35, "#ffecb3", 34);
          audio.beep(860, 0.16, "triangle");
          setMode("reward", "蘋果魔法湯完成了");
        }
      }
    }

    function pointerUp() {
      if (state.mode === "cook" && state.drag?.type === "apple") {
        const center = potCenter();
        if (dist(state.apple, center) < 140) {
          state.apple.x = center.x;
          state.apple.y = center.y - 8;
          spawnBurst(center.x, center.y - 25, "#ffcc80", 26);
          audio.beep(700, 0.12);
          setMode("stir", "在鍋裡繞圈圈攪拌");
        } else {
          state.apple.x = 410;
          state.apple.y = 315;
          audio.beep(260, 0.07, "sine");
        }
      }
      state.drag = null;
      state.stir.active = false;
    }

    function potCenter() {
      return { x: state.pot.x + state.pot.w / 2, y: state.pot.y + state.pot.h / 2 };
    }

    function update(dt) {
      state.time += dt;
      state.cutFlash = Math.max(0, state.cutFlash - dt);
      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 220 * dt;
        p.life -= dt;
      }
      state.particles = state.particles.filter((p) => p.life > 0);
    }

    function drawKitchen() {
      ctx.fillStyle = "#fff7d6";
      ctx.fillRect(0, 0, VIEW.w, VIEW.h);
      ctx.fillStyle = "#a5d6a7";
      ctx.fillRect(0, 0, VIEW.w, 116);
      ctx.fillStyle = "#ffe082";
      ctx.fillRect(0, 116, VIEW.w, 218);
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(0, 378, VIEW.w, 162);
      ctx.fillStyle = "#6d4c41";
      ctx.fillRect(0, 378, VIEW.w, 14);

      drawWindow(54, 32);
      drawShelf(660, 54);
      drawMute();
    }

    function drawWindow(x, y) {
      roundRect(x, y, 170, 106, 8, "#ffffff");
      ctx.fillStyle = "#90caf9";
      ctx.fillRect(x + 12, y + 12, 146, 82);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x + 85, y + 12);
      ctx.lineTo(x + 85, y + 94);
      ctx.moveTo(x + 12, y + 53);
      ctx.lineTo(x + 158, y + 53);
      ctx.stroke();
      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.arc(x + 132, y + 30, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawShelf(x, y) {
      roundRect(x, y + 60, 208, 18, 8, "#7e5745");
      drawJar(x + 28, y, "#ef5350");
      drawJar(x + 88, y + 12, "#66bb6a");
      drawJar(x + 148, y + 4, "#42a5f5");
    }

    function drawJar(x, y, color) {
      roundRect(x, y + 12, 34, 50, 6, "#ffffff");
      ctx.fillStyle = color;
      ctx.fillRect(x + 5, y + 28, 24, 27);
      roundRect(x + 7, y, 20, 18, 4, "#8d6e63");
    }

    function drawMute() {
      roundRect(hit.mute.x, hit.mute.y, hit.mute.w, hit.mute.h, 8, "#ffffff");
      ctx.fillStyle = "#5d4037";
      ctx.font = "700 24px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(state.mute ? "靜" : "聲", hit.mute.x + hit.mute.w / 2, hit.mute.y + hit.mute.h / 2);
    }

    function drawTitle() {
      drawKitchen();
      drawChef(215, 302, 1.22, true);
      drawPot(610, 270, 1.14);
      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 48px system-ui";
      ctx.fillText("王國廚房", VIEW.w / 2, 166);
      ctx.font = "700 26px system-ui";
      ctx.fillText("我的魔法平底鍋", VIEW.w / 2, 216);
      drawButton(hit.start, "開始料理", "#ff8a65");
    }

    function drawOrder() {
      drawKitchen();
      drawChef(210, 318, 1.22, true);
      drawSpeech(326, 160, 430, 140, "我想喝", "蘋果魔法湯");
      drawApple(530, 354, 52, 1);
      drawButton(hit.order, "好呀", "#66bb6a");
    }

    function drawWash() {
      drawWorkScene();
      drawSpeech(98, 138, 292, 92, "洗一洗", "乾乾淨淨");
      drawApple(state.apple.x, state.apple.y, state.apple.r, 1);
      const alpha = 1 - state.wash;
      for (const d of state.dirt) {
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = "#795548";
        ctx.beginPath();
        ctx.arc(state.apple.x + d.x, state.apple.y + d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawProgress(338, 438, 284, state.wash, "#4fc3f7");
    }

    function drawCut() {
      drawWorkScene();
      drawSpeech(98, 138, 292, 92, "點三下", "切成小塊");
      drawCuttingBoard(326, 260, 260, 132);
      drawCutStageApple(state.apple.x, state.apple.y, state.cuts);
      drawKnife(state.apple.x + 82, state.apple.y - 92 + (state.cutFlash > 0 ? 38 : Math.sin(state.time * 5) * 5), state.cutFlash);
      drawProgress(338, 438, 284, state.cuts / 3, "#ffb74d");
    }

    function drawCook() {
      drawWorkScene();
      drawSpeech(76, 138, 330, 92, "拖到鍋鍋", "輕輕放進去");
      drawPot(state.pot.x, state.pot.y, 1);
      drawApple(state.apple.x, state.apple.y, 46, 0.96);
      const center = potCenter();
      ctx.strokeStyle = "rgba(255, 213, 79, 0.82)";
      ctx.lineWidth = 5;
      ctx.setLineDash([14, 12]);
      ctx.beginPath();
      ctx.arc(center.x, center.y, 136 + Math.sin(state.time * 4) * 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawStir() {
      drawWorkScene();
      drawSpeech(70, 138, 336, 92, "繞圈圈", "攪一攪");
      drawPot(state.pot.x, state.pot.y, 1.08);
      const center = potCenter();
      ctx.strokeStyle = "#fff59d";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(center.x, center.y - 10, 58, state.time * 2, state.time * 2 + Math.PI * 1.35);
      ctx.stroke();
      drawProgress(338, 438, 284, Math.min(1, state.stir.travel / (Math.PI * 4.2)), "#fff176");
    }

    function drawReward() {
      drawKitchen();
      drawChef(210, 318, 1.22, true);
      drawSpeech(326, 142, 430, 122, "完成了", "好香喔");
      drawSoupBowl(520, 354, 1.15);
      drawSticker(705, 350);
      drawButton(hit.again, "再煮一次", "#42a5f5");
    }

    function drawWorkScene() {
      drawKitchen();
      drawCounterItems();
      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 28px system-ui";
      ctx.fillText(state.message, VIEW.w / 2, 70);
    }

    function drawCounterItems() {
      roundRect(84, 408, 214, 42, 8, "#a1887f");
      drawJar(118, 330, "#f06292");
      drawJar(184, 340, "#ffee58");
    }

    function drawChef(x, y, scale = 1, happy = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#5d4037";
      ctx.beginPath();
      ctx.arc(0, 66, 62, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd7b5";
      ctx.beginPath();
      ctx.arc(0, -12, 58, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-38, -68, 28, 0, Math.PI * 2);
      ctx.arc(0, -82, 34, 0, Math.PI * 2);
      ctx.arc(38, -68, 28, 0, Math.PI * 2);
      ctx.fill();
      roundRect(-58, -66, 116, 26, 9, "#ffffff");
      ctx.fillStyle = "#4e342e";
      ctx.beginPath();
      ctx.arc(-20, -18, 6, 0, Math.PI * 2);
      ctx.arc(20, -18, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#4e342e";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (happy) {
        ctx.arc(0, 2, 23, 0.2, Math.PI - 0.2);
      } else {
        ctx.moveTo(-18, 10);
        ctx.lineTo(18, 10);
      }
      ctx.stroke();
      roundRect(-60, 54, 120, 98, 20, "#ef5350");
      roundRect(-40, 66, 80, 82, 12, "#ffffff");
      ctx.restore();
    }

    function drawApple(x, y, r, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const dip = r * 0.34;
      const top = -r * 0.58;
      const bottom = r * 0.72;

      ctx.fillStyle = "#e53935";
      ctx.beginPath();
      ctx.moveTo(0, top);
      ctx.bezierCurveTo(-r * 0.16, top - r * 0.14, -r * 0.48, top - r * 0.05, -r * 0.64, -r * 0.02);
      ctx.bezierCurveTo(-r * 0.95, r * 0.28, -r * 0.62, r * 0.82, -r * 0.12, bottom);
      ctx.bezierCurveTo(-r * 0.04, bottom + r * 0.03, r * 0.04, bottom + r * 0.03, r * 0.12, bottom);
      ctx.bezierCurveTo(r * 0.62, r * 0.82, r * 0.95, r * 0.28, r * 0.64, -r * 0.02);
      ctx.bezierCurveTo(r * 0.48, top - r * 0.05, r * 0.16, top - r * 0.14, 0, top);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(183, 28, 28, 0.22)";
      ctx.beginPath();
      ctx.moveTo(r * 0.34, top + r * 0.2);
      ctx.bezierCurveTo(r * 0.66, r * 0.08, r * 0.64, r * 0.54, r * 0.2, bottom - r * 0.04);
      ctx.bezierCurveTo(r * 0.48, r * 0.48, r * 0.5, r * 0.1, r * 0.24, top + r * 0.28);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#b71c1c";
      ctx.beginPath();
      ctx.ellipse(0, top + r * 0.08, dip * 0.74, r * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(-r * 0.34, -r * 0.18, r * 0.15, r * 0.2, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "#5d4037";
      ctx.lineWidth = Math.max(4, r * 0.08);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(r * 0.02, top - r * 0.02);
      ctx.quadraticCurveTo(r * 0.06, -r * 0.88, r * 0.27, -r * 1.02);
      ctx.stroke();

      ctx.fillStyle = "#66bb6a";
      ctx.beginPath();
      ctx.ellipse(r * 0.43, -r * 0.76, r * 0.28, r * 0.15, -0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCuttingBoard(x, y, w, h) {
      roundRect(x, y, w, h, 8, "#f6c17a");
      roundRect(x + 14, y + 13, w - 28, h - 26, 8, "#ffd08a");
      ctx.fillStyle = "#d99045";
      ctx.beginPath();
      ctx.arc(x + 32, y + 34, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(141, 85, 36, 0.35)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 62, y + h - 30);
      ctx.lineTo(x + w - 42, y + 28);
      ctx.stroke();
    }

    function drawCutStageApple(x, y, cuts) {
      if (cuts === 0) {
        drawApple(x, y - 2, 58, 1);
        drawCutGuide(x, y - 56, 116);
        return;
      }

      const pieces = Math.min(4, cuts + 1);
      const startX = x - (pieces - 1) * 31;
      for (let i = 0; i < pieces; i++) {
        const lean = (i - (pieces - 1) / 2) * 0.1;
        drawAppleSlice(startX + i * 62, y + Math.abs(i - 1.5) * 3, 1, lean);
      }

      if (cuts < 3) {
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + 22 + cuts * 18, y - 52);
        ctx.lineTo(x - 8 + cuts * 18, y + 46);
        ctx.stroke();
      }
    }

    function drawCutGuide(x, y, h) {
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.setLineDash([10, 8]);
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 25 + 20, y);
        ctx.lineTo(x + i * 25 - 14, y + h);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawAppleSlice(x, y, scale = 1, rotate = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#d32f2f";
      ctx.beginPath();
      ctx.ellipse(0, 0, 34, 58, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff3c4";
      ctx.beginPath();
      ctx.ellipse(3, 0, 25, 48, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffcc80";
      ctx.beginPath();
      ctx.ellipse(8, 0, 12, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6d4c41";
      ctx.beginPath();
      ctx.ellipse(4, -10, 3, 6, -0.2, 0, Math.PI * 2);
      ctx.ellipse(8, 12, 3, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawKnife(x, y, flash) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.42);
      if (flash > 0) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-48, 64);
        ctx.lineTo(24, 94);
        ctx.stroke();
      }
      ctx.fillStyle = "#b0bec5";
      ctx.beginPath();
      ctx.moveTo(-88, 0);
      ctx.lineTo(44, 0);
      ctx.quadraticCurveTo(70, 18, 44, 36);
      ctx.lineTo(-88, 36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#eceff1";
      ctx.beginPath();
      ctx.moveTo(-70, 6);
      ctx.lineTo(42, 6);
      ctx.quadraticCurveTo(54, 15, 42, 24);
      ctx.lineTo(-70, 18);
      ctx.closePath();
      ctx.fill();
      roundRect(-136, -4, 56, 44, 8, "#6d4c41");
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.arc(-118, 18, 4, 0, Math.PI * 2);
      ctx.arc(-96, 18, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPot(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      roundRect(0, 42, 230, 92, 16, "#42a5f5");
      ctx.fillStyle = "#1e88e5";
      ctx.fillRect(18, 78, 194, 18);
      ctx.fillStyle = "#90caf9";
      ctx.beginPath();
      ctx.ellipse(115, 44, 92, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffcc80";
      ctx.beginPath();
      ctx.ellipse(115, 44, 72, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      roundRect(-26, 65, 42, 25, 10, "#1e88e5");
      roundRect(214, 65, 42, 25, 10, "#1e88e5");
      ctx.restore();
    }

    function drawSoupBowl(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(0, 0, 96, 38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffb74d";
      ctx.beginPath();
      ctx.ellipse(0, -4, 72, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#42a5f5";
      ctx.beginPath();
      ctx.moveTo(-82, 8);
      ctx.quadraticCurveTo(-62, 82, 0, 88);
      ctx.quadraticCurveTo(62, 82, 82, 8);
      ctx.closePath();
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        const sx = -34 + i * 34;
        ctx.moveTo(sx, -72);
        ctx.quadraticCurveTo(sx - 18, -50, sx, -28);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSticker(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(state.time * 3) * 0.06);
      roundRect(-66, -68, 132, 136, 8, "#fff8e1");
      ctx.strokeStyle = "#ffca28";
      ctx.lineWidth = 7;
      ctx.strokeRect(-56, -58, 112, 116);
      drawApple(0, -8, 34, 1);
      ctx.fillStyle = "#5d4037";
      ctx.font = "800 22px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("貼紙", 0, 48);
      ctx.restore();
    }

    function drawSpeech(x, y, w, h, line1, line2) {
      roundRect(x, y, w, h, 18, "#ffffff");
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(x + 54, y + h - 2);
      ctx.lineTo(x + 20, y + h + 36);
      ctx.lineTo(x + 106, y + h - 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 28px system-ui";
      ctx.fillText(line1, x + w / 2, y + h * 0.35);
      ctx.font = "900 34px system-ui";
      ctx.fillText(line2, x + w / 2, y + h * 0.68);
    }

    function drawButton(rect, label, color) {
      roundRect(rect.x, rect.y, rect.w, rect.h, 8, "#5d4037");
      roundRect(rect.x + 6, rect.y + 6, rect.w - 12, rect.h - 12, 8, color);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 30px system-ui";
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    }

    function drawProgress(x, y, w, value, color) {
      roundRect(x, y, w, 26, 8, "#ffffff");
      roundRect(x + 4, y + 4, Math.max(8, (w - 8) * value), 18, 7, color);
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function roundRect(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, VIEW.w, VIEW.h);
      if (state.mode === "menu") drawTitle();
      if (state.mode === "order") drawOrder();
      if (state.mode === "wash") drawWash();
      if (state.mode === "cut") drawCut();
      if (state.mode === "cook") drawCook();
      if (state.mode === "stir") drawStir();
      if (state.mode === "reward") drawReward();
      drawParticles();
    }

    function renderGameToText() {
      const center = potCenter();
      const payload = {
        coordinateSystem: "Canvas coordinates, origin top-left, x right, y down, size 960x540.",
        mode: state.mode,
        message: state.message,
        progress: {
          wash: Number(state.wash.toFixed(2)),
          cuts: state.cuts,
          stir: Number(Math.min(1, state.stir.travel / (Math.PI * 4.2)).toFixed(2))
        },
        interactiveTargets: {
          startButton: hit.start,
          orderButton: hit.order,
          apple: { x: Math.round(state.apple.x), y: Math.round(state.apple.y), r: Math.round(state.apple.r || 46) },
          pot: { x: Math.round(center.x), y: Math.round(center.y), r: 140 },
          againButton: hit.again,
          muteButton: hit.mute
        }
      };
      return JSON.stringify(payload);
    }

    function loop(timestamp) {
      const next = timestamp / 1000;
      const dt = Math.min(0.033, next - (loop.last || next));
      loop.last = next;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", pointerDown);
    canvas.addEventListener("pointermove", pointerMove);
    window.addEventListener("pointerup", pointerUp);
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "f") {
        if (document.fullscreenElement) document.exitFullscreen();
        else canvas.requestFullscreen?.();
      }
    });

    window.render_game_to_text = renderGameToText;
    window.advanceTime = (ms) => {
      const steps = Math.max(1, Math.round(ms / (1000 / 60)));
      for (let i = 0; i < steps; i++) update(1 / 60);
      render();
    };

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

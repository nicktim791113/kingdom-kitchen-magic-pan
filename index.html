        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ffd54f";
        ctx.beginPath();
        ctx.arc(0, -82, 7, 0, Math.PI * 2);
        ctx.fill();
      } else if (guest.hat === "helmet") {
        ctx.fillStyle = "#b0bec5";
        ctx.beginPath();
        ctx.arc(0, -28, 48, Math.PI, Math.PI * 2);
        ctx.lineTo(48, -12);
        ctx.lineTo(-48, -12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#78909c";
        ctx.fillRect(-42, -18, 84, 10);
      } else {
        ctx.fillStyle = "#ffca28";
        ctx.beginPath();
        ctx.moveTo(-42, -44);
        ctx.lineTo(-24, -82);
        ctx.lineTo(0, -52);
        ctx.lineTo(24, -82);
        ctx.lineTo(42, -44);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#4e342e";
      ctx.beginPath();
      ctx.arc(-18, -14, 6, 0, Math.PI * 2);
      ctx.arc(18, -14, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#4e342e";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (happy) ctx.arc(0, 4, 20, 0.2, Math.PI - 0.2);
      else {
        ctx.moveTo(-16, 8);
        ctx.lineTo(16, 8);
      }
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "800 20px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(guest.name, 0, 104);
      ctx.restore();
    }

    function drawLoadedSprite(image, x, y, maxW, maxH = maxW) {
      if (!image || !image.complete || !image.naturalWidth) return false;
      const ratio = Math.min(maxW / image.naturalWidth, maxH / image.naturalHeight);
      const w = image.naturalWidth * ratio;
      const h = image.naturalHeight * ratio;
      ctx.drawImage(image, x - w / 2, y - h / 2, w, h);
      return true;
    }

    function drawFruitSprite(kind, x, y, r, scale = 1) {
      return drawLoadedSprite(fruitSprites[kind], x, y, r * 2.08 * scale);
    }

    function drawPrepSprite(kind, x, y, maxW = 226, maxH = 140) {
      return drawLoadedSprite(prepSprites[kind], x, y, maxW, maxH);
    }

    function drawCharacterSprite(id, x, y, maxW, maxH) {
      return drawLoadedSprite(characterSprites[id], x, y, maxW, maxH);
    }

    function drawEnvironmentSprite(id, x, y, maxW, maxH) {
      return drawLoadedSprite(environmentSprites[id], x, y, maxW, maxH);
    }

    function drawKitchenSprite() {
      const image = environmentSprites.kitchen;
      if (!image || !image.complete || !image.naturalWidth) return false;
      ctx.drawImage(image, 0, 0, VIEW.w, VIEW.h);
      return true;
    }

    function drawPotGlow(x, y, scale = 1, strength = 1) {
      const pulse = 0.55 + Math.sin(state.time * 3.2) * 0.18;
      const sweep = Math.sin(state.time * 1.5) * 16;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = Math.max(0.08, pulse * strength);
      ctx.fillStyle = "rgba(255, 245, 157, 0.38)";
      ctx.beginPath();
      ctx.ellipse(82 + sweep, 74, 34, 10, -0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.18 * strength;
      ctx.strokeStyle = "#fff9c4";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.ellipse(115, 46, 93, 25, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawSteamDrift(x, y, scale = 1, drift = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const phase = state.time * 1.45 + i * 1.18 + drift;
        const sx = -34 + i * 34 + Math.sin(phase) * 4;
        const lift = Math.sin(phase * 0.82) * 7;
        ctx.globalAlpha = 0.32 + Math.sin(phase + 0.8) * 0.08;
        ctx.strokeStyle = "#fffde7";
        ctx.lineWidth = 5 - i * 0.25;
        ctx.beginPath();
        ctx.moveTo(sx, -18);
        ctx.bezierCurveTo(sx - 18, -34 - lift, sx + 18, -52 - lift, sx + Math.sin(phase * 1.4) * 10, -74 - lift);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawStickerSparkles(x, y, scale = 1) {
      const points = [
        { x: -58, y: -48, phase: 0 },
        { x: 58, y: -38, phase: 1.7 },
        { x: 44, y: 50, phase: 3.2 }
      ];
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      for (const point of points) {
        const twinkle = 0.5 + Math.sin(state.time * 5.8 + point.phase) * 0.5;
        ctx.globalAlpha = 0.22 + twinkle * 0.58;
        drawStar(point.x, point.y, 7 + twinkle * 4, "#fff59d");
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawFruit(kind, x, y, r, scale = 1, options = {}) {
      if (!options.forceCanvas && drawFruitSprite(kind, x, y, r, scale)) return;
      if (kind === "banana") return drawBanana(x, y, r, scale);
      if (kind === "strawberry") return drawStrawberry(x, y, r, scale);
      if (kind === "orange") return drawOrange(x, y, r, scale);
      if (kind === "carrot") return drawCarrot(x, y, r, scale);
      return drawApple(x, y, r, scale);
    }

    // --- 3D 浮動效果輔助 ---
    // 在水果下方畫一顆柔和的橢圓陰影，營造水果懸浮的錯覺。
    function drawFloatShadow(x, y, r, lift = 0, intensity = 0.32) {
      const dropRatio = Math.max(0.35, 1 - lift / Math.max(20, r * 0.9));
      const shadowR = r * 0.92;
      const shadowH = r * 0.22 * dropRatio;
      ctx.save();
      const grad = ctx.createRadialGradient(x, y + r * 0.96, shadowH * 0.2, x, y + r * 0.96, shadowR);
      grad.addColorStop(0, `rgba(67, 38, 22, ${intensity * dropRatio})`);
      grad.addColorStop(0.55, `rgba(67, 38, 22, ${intensity * 0.4 * dropRatio})`);
      grad.addColorStop(1, "rgba(67, 38, 22, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.96, shadowR, shadowH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 在水果上覆蓋淡淡的弧形高光，讓 PNG 看起來更有 3D 立體感。
    function drawFruitGloss(x, y, r, options = {}) {
      const cx = x - r * 0.34;
      const cy = y - r * 0.36;
      const rx = r * 0.55;
      const ry = r * 0.32;
      ctx.save();
      ctx.globalCompositeOperation = options.composite || "lighter";
      const grad = ctx.createRadialGradient(cx, cy, rx * 0.1, cx, cy, rx);
      grad.addColorStop(0, `rgba(255,255,255,${options.alpha ?? 0.38})`);
      grad.addColorStop(0.55, "rgba(255,255,255,0.10)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 在水果邊緣加入一圈淡淡的暖色輪光，強化立體感。
    function drawFruitRimLight(x, y, r, color = "#fff3c4") {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, r * 0.07);
      ctx.beginPath();
      ctx.arc(x + r * 0.05, y + r * 0.08, r * 0.95, Math.PI * 0.15, Math.PI * 0.75);
      ctx.stroke();
      ctx.restore();
    }

    // 將水果以「浮動 + 陰影 + 高光」的方式繪製，模擬輕微的 3D 浮起。
    // bobSeed 可指定不同水果的擺動相位，避免一起上下動。
    // amplitude 控制浮動幅度（像素），可在小卡片上調小、在主場景調大。
    function drawFloatingFruit(kind, x, y, r, scale = 1, options = {}) {
      const amplitude = options.amplitude ?? 4;
      const speed = options.speed ?? 1.8;
      const bobSeed = options.bobSeed ?? 0;
      const phase = state.time * speed + bobSeed;
      const lift = Math.sin(phase) * amplitude;
      const tilt = Math.sin(phase * 0.7 + 0.4) * (options.tilt ?? 0.05);

      const shadowR = r * scale;
      drawFloatShadow(x, y + amplitude + r * 0.04, shadowR, lift + amplitude, options.shadowIntensity ?? 0.28);

      ctx.save();
      ctx.translate(x, y + lift);
      ctx.rotate(tilt);
      drawFruit(kind, 0, 0, r, scale, options);
      if (options.gloss !== false) drawFruitGloss(0, 0, r * scale, { alpha: options.glossAlpha ?? 0.32 });
      if (options.rim !== false) drawFruitRimLight(0, 0, r * scale, options.rimColor);
      ctx.restore();

      return { lift, tilt };
    }

    function drawApple(x, y, r, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const top = -r * 0.48;
      const bottom = r * 0.82;

      ctx.shadowColor = "rgba(93, 64, 55, 0.2)";
      ctx.shadowBlur = r * 0.08;
      ctx.shadowOffsetY = r * 0.08;

      ctx.fillStyle = "#b71c1c";
      ctx.beginPath();
      ctx.moveTo(0, top);
      ctx.bezierCurveTo(-r * 0.12, -r * 0.72, -r * 0.48, -r * 0.78, -r * 0.72, -r * 0.48);
      ctx.bezierCurveTo(-r * 1.04, -r * 0.08, -r * 0.88, r * 0.58, -r * 0.42, bottom);
      ctx.bezierCurveTo(-r * 0.22, r * 0.96, -r * 0.06, r * 0.76, 0, r * 0.78);
      ctx.bezierCurveTo(r * 0.08, r * 0.76, r * 0.24, r * 0.96, r * 0.44, bottom);
      ctx.bezierCurveTo(r * 0.9, r * 0.58, r * 1.04, -r * 0.08, r * 0.72, -r * 0.48);
      ctx.bezierCurveTo(r * 0.48, -r * 0.78, r * 0.12, -r * 0.72, 0, top);
      ctx.closePath();
      ctx.fill();

      ctx.shadowColor = "transparent";
      ctx.strokeStyle = "#8e1b16";
      ctx.lineWidth = Math.max(3, r * 0.075);
      ctx.lineJoin = "round";
      ctx.stroke();

      const bodyGradient = ctx.createRadialGradient(-r * 0.36, -r * 0.28, r * 0.08, 0, r * 0.08, r * 1.08);
      bodyGradient.addColorStop(0, "#ff6f61");
      bodyGradient.addColorStop(0.48, "#ef3f38");
      bodyGradient.addColorStop(1, "#c92525");
      ctx.fillStyle = bodyGradient;
      ctx.beginPath();
      ctx.moveTo(0, top + r * 0.05);
      ctx.bezierCurveTo(-r * 0.12, -r * 0.62, -r * 0.44, -r * 0.67, -r * 0.62, -r * 0.4);
      ctx.bezierCurveTo(-r * 0.88, -r * 0.02, -r * 0.72, r * 0.5, -r * 0.35, r * 0.7);
      ctx.bezierCurveTo(-r * 0.18, r * 0.82, -r * 0.04, r * 0.65, 0, r * 0.68);
      ctx.bezierCurveTo(r * 0.06, r * 0.65, r * 0.2, r * 0.82, r * 0.37, r * 0.7);
      ctx.bezierCurveTo(r * 0.74, r * 0.5, r * 0.88, -r * 0.02, r * 0.62, -r * 0.4);
      ctx.bezierCurveTo(r * 0.44, -r * 0.67, r * 0.12, -r * 0.62, 0, top + r * 0.05);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(139, 0, 0, 0.28)";
      ctx.beginPath();
      ctx.moveTo(r * 0.42, -r * 0.22);
      ctx.bezierCurveTo(r * 0.72, r * 0.12, r * 0.54, r * 0.55, r * 0.22, r * 0.68);
      ctx.bezierCurveTo(r * 0.52, r * 0.28, r * 0.5, -r * 0.1, r * 0.28, -r * 0.35);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.42;
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, -r * 0.18, r * 0.13, r * 0.2, -0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.22;
      ctx.beginPath();
      ctx.ellipse(-r * 0.22, r * 0.08, r * 0.07, r * 0.13, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "#5d4037";
      ctx.lineWidth = Math.max(4, r * 0.08);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(r * 0.03, top + r * 0.08);
      ctx.quadraticCurveTo(r * 0.05, -r * 0.84, r * 0.28, -r * 1.0);
      ctx.stroke();

      ctx.fillStyle = "#66bb6a";
      ctx.beginPath();
      ctx.ellipse(r * 0.46, -r * 0.75, r * 0.32, r * 0.16, -0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(46, 125, 50, 0.55)";
      ctx.lineWidth = Math.max(2, r * 0.035);
      ctx.beginPath();
      ctx.moveTo(r * 0.28, -r * 0.68);
      ctx.quadraticCurveTo(r * 0.46, -r * 0.78, r * 0.68, -r * 0.84);
      ctx.stroke();
      ctx.restore();
    }

    function drawBanana(x, y, r, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.rotate(-0.2);

      ctx.shadowColor = "rgba(93, 64, 55, 0.18)";
      ctx.shadowBlur = r * 0.08;
      ctx.shadowOffsetY = r * 0.08;

      ctx.fillStyle = "#f9a825";
      ctx.beginPath();
      ctx.moveTo(-r * 0.98, -r * 0.18);
      ctx.bezierCurveTo(-r * 0.42, r * 0.92, r * 0.52, r * 0.9, r * 0.98, -r * 0.1);
      ctx.bezierCurveTo(r * 0.5, r * 0.45, -r * 0.2, r * 0.42, -r * 0.72, -r * 0.28);
      ctx.closePath();
      ctx.fill();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "#ffd95a";
      ctx.beginPath();
      ctx.moveTo(-r * 0.78, -r * 0.18);
      ctx.bezierCurveTo(-r * 0.26, r * 0.54, r * 0.42, r * 0.55, r * 0.78, -r * 0.08);
      ctx.bezierCurveTo(r * 0.34, r * 0.25, -r * 0.2, r * 0.22, -r * 0.58, -r * 0.24);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#8d6e63";
      ctx.lineWidth = Math.max(3, r * 0.055);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-r * 0.72, -r * 0.1);
      ctx.bezierCurveTo(-r * 0.16, r * 0.44, r * 0.42, r * 0.38, r * 0.76, -r * 0.08);
      ctx.stroke();

      ctx.fillStyle = "#6d4c41";
      ctx.beginPath();
      ctx.ellipse(-r * 0.95, -r * 0.2, r * 0.12, r * 0.08, -0.2, 0, Math.PI * 2);
      ctx.ellipse(r * 0.98, -r * 0.12, r * 0.1, r * 0.08, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.34;
      ctx.beginPath();
      ctx.ellipse(-r * 0.28, r * 0.13, r * 0.12, r * 0.06, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawStrawberry(x, y, r, scale = 1, leafAmount = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.shadowColor = "rgba(93, 64, 55, 0.18)";
      ctx.shadowBlur = r * 0.08;
      ctx.shadowOffsetY = r * 0.08;

      ctx.fillStyle = "#b71c35";
      ctx.beginPath();
      ctx.moveTo(0, r * 0.82);
      ctx.bezierCurveTo(-r * 0.78, r * 0.16, -r * 0.62, -r * 0.68, 0, -r * 0.58);
      ctx.bezierCurveTo(r * 0.62, -r * 0.68, r * 0.78, r * 0.16, 0, r * 0.82);
      ctx.closePath();
      ctx.fill();

      ctx.shadowColor = "transparent";
      const gradient = ctx.createRadialGradient(-r * 0.28, -r * 0.2, r * 0.05, 0, r * 0.08, r);
      gradient.addColorStop(0, "#ff7a8a");
      gradient.addColorStop(0.5, "#ef476f");
      gradient.addColorStop(1, "#c91d44");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(0, r * 0.68);
      ctx.bezierCurveTo(-r * 0.62, r * 0.12, -r * 0.5, -r * 0.52, 0, -r * 0.46);
      ctx.bezierCurveTo(r * 0.5, -r * 0.52, r * 0.62, r * 0.12, 0, r * 0.68);
      ctx.closePath();
      ctx.fill();

      if (leafAmount > 0) {
        ctx.fillStyle = "#2e7d32";
        ctx.globalAlpha = leafAmount;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.ellipse(i * r * 0.12, -r * 0.54, r * 0.14, r * 0.26, i * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = "#ffe082";
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const px = (col - 1) * r * 0.22 + (row % 2) * r * 0.08;
          const py = -r * 0.16 + row * r * 0.22;
          ctx.beginPath();
          ctx.ellipse(px, py, r * 0.035, r * 0.06, 0.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.36;
      ctx.beginPath();
      ctx.ellipse(-r * 0.22, -r * 0.18, r * 0.11, r * 0.18, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawOrange(x, y, r, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.shadowColor = "rgba(93, 64, 55, 0.18)";
      ctx.shadowBlur = r * 0.08;
      ctx.shadowOffsetY = r * 0.08;

      ctx.fillStyle = "#ef6c00";
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.74, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = "transparent";
      const gradient = ctx.createRadialGradient(-r * 0.28, -r * 0.28, r * 0.08, 0, 0, r * 0.82);
      gradient.addColorStop(0, "#ffcc80");
      gradient.addColorStop(0.5, "#ff9800");
      gradient.addColorStop(1, "#f57c00");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.64, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 236, 179, 0.7)";
      ctx.lineWidth = Math.max(2, r * 0.035);
      for (let i = 0; i < 8; i++) {
        const angle = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * r * 0.48, Math.sin(angle) * r * 0.48);
        ctx.stroke();
      }

      ctx.fillStyle = "#fff3e0";
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#66bb6a";
      ctx.beginPath();
      ctx.ellipse(r * 0.28, -r * 0.72, r * 0.24, r * 0.12, -0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCarrot(x, y, r, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.rotate(-0.58);

      ctx.shadowColor = "rgba(93, 64, 55, 0.18)";
      ctx.shadowBlur = r * 0.08;
      ctx.shadowOffsetY = r * 0.08;

      const gradient = ctx.createLinearGradient(-r * 0.9, 0, r * 0.9, 0);
      gradient.addColorStop(0, "#ffcc80");
      gradient.addColorStop(0.45, "#ff8f00");
      gradient.addColorStop(1, "#e65100");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(-r * 0.96, 0);
      ctx.bezierCurveTo(-r * 0.45, -r * 0.46, r * 0.58, -r * 0.42, r * 0.86, 0);
      ctx.bezierCurveTo(r * 0.58, r * 0.42, -r * 0.45, r * 0.46, -r * 0.96, 0);
      ctx.closePath();
      ctx.fill();

      ctx.shadowColor = "transparent";
      ctx.strokeStyle = "#d65f00";
      ctx.lineWidth = Math.max(3, r * 0.055);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 236, 179, 0.62)";
      ctx.lineWidth = Math.max(2, r * 0.04);
      ctx.lineCap = "round";
      for (let i = 0; i < 5; i++) {
        const sx = -r * 0.48 + i * r * 0.24;
        ctx.beginPath();
        ctx.moveTo(sx, -r * 0.18);
        ctx.lineTo(sx + r * 0.16, r * 0.16);
        ctx.stroke();
      }

      ctx.fillStyle = "#66bb6a";
      for (let i = -1; i <= 1; i++) {
        ctx.save();
        ctx.translate(r * 0.84, i * r * 0.06);
        ctx.rotate(i * 0.45);
        ctx.beginPath();
        ctx.ellipse(r * 0.22, 0, r * 0.38, r * 0.13, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawCuttingBoard(x, y, w, h) {
      roundRect(x, y, w, h, 8, "#f6c17a");
      roundRect(x + 14, y + 13, w - 28, h - 26, 8, "#ffd08a");
      ctx.fillStyle = "#d99045";
      ctx.beginPath();
      ctx.arc(x + 32, y + 34, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(141, 85, 36, 0.35)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 62, y + h - 30);
      ctx.lineTo(x + w - 42, y + 28);
      ctx.stroke();
    }

    function drawPrepStage(x, y, progress) {
      if (progress >= 2.95 && drawPrepSprite(state.fruit.id, x, y + 2)) return;
      if (state.fruit.prep.kind === "peel") return drawBananaPeelStage(x, y, progress);
      if (state.fruit.prep.kind === "pluck") return drawStrawberryPluckStage(x, y, progress);
      if (state.fruit.prep.kind === "segment") return drawOrangeSegmentStage(x, y, progress);
      if (state.fruit.prep.kind === "brush") return drawCarrotBrushStage(x, y, progress);
      drawCutStageApple(x, y, progress);
    }

    function drawBananaPeelStage(x, y, progress) {
      const amount = Math.min(1, progress / 3);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.1);

      ctx.fillStyle = "#fff7c2";
      ctx.beginPath();
      ctx.ellipse(0, 0, 88, 26, -0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#f9a825";
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-74 + i * 6, -2);
        ctx.quadraticCurveTo(-18 + i * 22, 26 + amount * 52, 50 + i * 12, -10 + amount * 22);
        ctx.stroke();
      }

      ctx.strokeStyle = "#8d6e63";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-74, -2);
      ctx.quadraticCurveTo(-14, 22 + amount * 40, 58, -8 + amount * 16);
      ctx.stroke();

      ctx.restore();
      if (progress >= 2.95) {
        drawFruitSlice("banana", x - 38, y + 4, 0.72, -0.25);
        drawFruitSlice("banana", x + 34, y + 4, 0.72, 0.2);
      }
    }

    function drawStrawberryPluckStage(x, y, progress) {
      drawStrawberry(x, y + 6, 58, 1, Math.max(0, 1 - progress / 3));
      const leavesLeft = Math.max(0, 3 - Math.floor(progress));
      ctx.fillStyle = "#2e7d32";
      for (let i = 0; i < leavesLeft; i++) {
        const lx = x - 34 + i * 34;
        ctx.beginPath();
        ctx.ellipse(lx, y - 52 - Math.sin(state.time * 4 + i) * 3, 16, 26, (i - 1) * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
      if (progress > 0) {
        for (let i = 0; i < Math.min(3, Math.floor(progress)); i++) {
          ctx.fillStyle = "#66bb6a";
          ctx.beginPath();
          ctx.ellipse(x + 82 + i * 20, y - 28 + i * 18, 10, 18, i * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawOrangeSegmentStage(x, y, progress) {
      if (progress === 0) {
        drawFruit("orange", x, y, 58, 1);
        drawCutGuide(x, y - 56, 112);
        return;
      }

      const pieces = Math.min(4, Math.floor(progress) + 1);
      for (let i = 0; i < pieces; i++) {
        const angle = -0.5 + i * 0.34;
        drawFruitSlice("orange", x - 70 + i * 46, y + Math.abs(i - 1.5) * 6, 0.62, angle);
      }
      if (progress < 3) drawCutGuide(x + 8, y - 52, 104);
    }

    function drawCarrotBrushStage(x, y, progress) {
      drawFruit("carrot", x, y, 58, 1);
      const done = Math.min(3, Math.floor(progress));
      for (let i = 0; i < done; i++) {
        drawFruitSlice("carrot", x + 82 + i * 24, y - 30 + i * 24, 0.52, i * 0.25);
      }
      if (progress < 3) {
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.86)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.setLineDash([14, 9]);
        for (let i = 0; i < 3; i++) {
          const by = y - 34 + i * 28;
          ctx.beginPath();
          ctx.moveTo(x - 82, by);
          ctx.quadraticCurveTo(x - 8, by - 18, x + 78, by + 4);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    function drawCutStageApple(x, y, cuts) {
      if (cuts === 0) {
        drawFruit(state.fruit.id, x, y - 2, 58, 1);
        drawCutGuide(x, y - 56, 116);
        return;
      }

      const pieces = Math.min(4, cuts + 1);
      const startX = x - (pieces - 1) * 31;
      for (let i = 0; i < pieces; i++) {
        const lean = (i - (pieces - 1) / 2) * 0.1;
        drawFruitSlice(state.fruit.id, startX + i * 62, y + Math.abs(i - 1.5) * 3, 1, lean);
      }

      if (cuts < 3) {
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + 22 + cuts * 18, y - 52);
        ctx.lineTo(x - 8 + cuts * 18, y + 46);
        ctx.stroke();
      }
    }

    function drawCutGuide(x, y, h) {
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.setLineDash([10, 8]);
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 25 + 20, y);
        ctx.lineTo(x + i * 25 - 14, y + h);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawFruitSlice(kind, x, y, scale = 1, rotate = 0) {
      if (kind === "banana") return drawBananaSlice(x, y, scale, rotate);
      if (kind === "strawberry") return drawStrawberrySlice(x, y, scale, rotate);
      if (kind === "orange") return drawOrangeSlice(x, y, scale, rotate);
      if (kind === "carrot") return drawCarrotSlice(x, y, scale, rotate);
      return drawAppleSlice(x, y, scale, rotate);
    }

    function drawAppleSlice(x, y, scale = 1, rotate = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);

      // Wedge silhouette (D-shape — flat-ish bottom, curved top is red skin)
      // 整體大小約 80x70
      // Skin band (curved outer)
      const skinGrad = ctx.createLinearGradient(0, -38, 0, 30);
      skinGrad.addColorStop(0, "#ff7558");
      skinGrad.addColorStop(0.5, "#e0392c");
      skinGrad.addColorStop(1, "#8d1a14");
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.moveTo(-38, 22);
      ctx.bezierCurveTo(-46, -8, -28, -42, 0, -42);
      ctx.bezierCurveTo(28, -42, 46, -8, 38, 22);
      ctx.bezierCurveTo(30, 30, -30, 30, -38, 22);
      ctx.closePath();
      ctx.fill();

      // Flesh
      const fleshGrad = ctx.createRadialGradient(-8, -10, 4, 0, 0, 42);
      fleshGrad.addColorStop(0, "#fffce8");
      fleshGrad.addColorStop(0.55, "#fff0c2");
      fleshGrad.addColorStop(1, "#e6c989");
      ctx.fillStyle = fleshGrad;
      ctx.beginPath();
      ctx.moveTo(-30, 18);
      ctx.bezierCurveTo(-38, -6, -22, -34, 0, -34);
      ctx.bezierCurveTo(22, -34, 38, -6, 30, 18);
      ctx.bezierCurveTo(22, 24, -22, 24, -30, 18);
      ctx.closePath();
      ctx.fill();

      // Subtle core stripe (darker tan)
      ctx.fillStyle = "rgba(210, 160, 90, 0.45)";
      ctx.beginPath();
      ctx.ellipse(0, 8, 14, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Seeds (2 dark teardrops)
      ctx.fillStyle = "#3e2a18";
      ctx.beginPath();
      ctx.ellipse(-5, 6, 2.2, 4, -0.35, 0, Math.PI * 2);
      ctx.ellipse(5, 8, 2.2, 4, 0.35, 0, Math.PI * 2);
      ctx.fill();
      // Seed highlights
      ctx.fillStyle = "rgba(255,230,200,0.55)";
      ctx.beginPath();
      ctx.ellipse(-5.5, 5, 0.8, 1.4, -0.35, 0, Math.PI * 2);
      ctx.ellipse(4.5, 7, 0.8, 1.4, 0.35, 0, Math.PI * 2);
      ctx.fill();

      // Top glossy highlight
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      ctx.beginPath();
      ctx.ellipse(-12, -22, 10, 14, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      // Skin shine on red rim
      ctx.strokeStyle = "rgba(255, 220, 190, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-30, -22);
      ctx.bezierCurveTo(-10, -38, 14, -38, 28, -24);
      ctx.stroke();

      ctx.restore();
    }

    function drawMagicWand(x, y, flash) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.55);
      ctx.strokeStyle = "#7e57c2";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-68, 58);
      ctx.lineTo(28, -38);
      ctx.stroke();

      ctx.fillStyle = "#ffd54f";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? 26 : 11;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const px = 28 + Math.cos(a) * r;
        const py = -38 + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (flash > 0) {
        ctx.strokeStyle = "rgba(255, 245, 157, 0.85)";
        ctx.lineWidth = 5;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(46 + i * 10, -62 + i * 8);
          ctx.lineTo(70 + i * 8, -80 + i * 3);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawBananaSlice(x, y, scale = 1, rotate = 0) {
      // 香蕉片：圓盤狀（橫切），中心三點黑芯
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);

      // 外圈：香蕉皮（深黃）
      const ringGrad = ctx.createRadialGradient(-6, -8, 4, 0, 0, 36);
      ringGrad.addColorStop(0, "#ffe35a");
      ringGrad.addColorStop(0.7, "#f7c01a");
      ringGrad.addColorStop(1, "#a07000");
      ctx.fillStyle = ringGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 34, 32, 0, 0, Math.PI * 2);
      ctx.fill();

      // 內肉：奶白
      const fleshGrad = ctx.createRadialGradient(-4, -6, 3, 0, 0, 28);
      fleshGrad.addColorStop(0, "#fffce6");
      fleshGrad.addColorStop(0.65, "#fff3b8");
      fleshGrad.addColorStop(1, "#e6c882");
      ctx.fillStyle = fleshGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 27, 25, 0, 0, Math.PI * 2);
      ctx.fill();

      // 中心三點種子（小黑點構成三角）
      ctx.fillStyle = "#3e2a18";
      [[0, -3.5], [-3, 2], [3, 2]].forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.ellipse(sx, sy, 1.2, 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // 高光
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.ellipse(-10, -10, 10, 7, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      ctx.restore();
    }

    function drawStrawberrySlice(x, y, scale = 1, rotate = 0) {
      // 草莓縱切片：心型外輪廓，內部有放射狀白色纖維
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);

      // 外輪廓
      const skinGrad = ctx.createLinearGradient(0, -42, 0, 50);
      skinGrad.addColorStop(0, "#ff7a8a");
      skinGrad.addColorStop(0.5, "#ef3f5a");
      skinGrad.addColorStop(1, "#a01030");
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.bezierCurveTo(-38, 8, -30, -38, 0, -42);
      ctx.bezierCurveTo(30, -38, 38, 8, 0, 50);
      ctx.closePath();
      ctx.fill();

      // 內部肉（粉白）
      const fleshGrad = ctx.createRadialGradient(-4, -8, 4, 0, 0, 36);
      fleshGrad.addColorStop(0, "#fffafa");
      fleshGrad.addColorStop(0.5, "#fde0e4");
      fleshGrad.addColorStop(1, "#f0a8b8");
      ctx.fillStyle = fleshGrad;
      ctx.beginPath();
      ctx.moveTo(0, 38);
      ctx.bezierCurveTo(-28, 6, -22, -28, 0, -32);
      ctx.bezierCurveTo(22, -28, 28, 6, 0, 38);
      ctx.closePath();
      ctx.fill();

      // 放射狀纖維線（從中心發散）
      ctx.strokeStyle = "rgba(255, 220, 220, 0.7)";
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 8; i++) {
        const angle = -Math.PI / 2 + i * (Math.PI * 2 / 10);
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(Math.cos(angle) * 22, Math.sin(angle) * 28);
        ctx.stroke();
      }

      // 黃色種子（小橢圓散布）
      ctx.fillStyle = "#ffe082";
      const seeds = [[-12, -20], [10, -22], [-16, -2], [14, 0], [-10, 18], [12, 20], [0, -28], [0, 28]];
      seeds.forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.ellipse(sx, sy, 1.8, 2.8, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // 高光
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.beginPath();
      ctx.ellipse(-12, -18, 8, 16, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      ctx.restore();
    }

    function drawOrangeSlice(x, y, scale = 1, rotate = 0) {
      // 橘子瓣：半月形（彎月狀），外圈橘皮+內部果肉果粒
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);

      // 月牙外輪廓
      const peelGrad = ctx.createLinearGradient(-30, 0, 30, 0);
      peelGrad.addColorStop(0, "#ffa726");
      peelGrad.addColorStop(0.5, "#f57c00");
      peelGrad.addColorStop(1, "#a04500");
      ctx.fillStyle = peelGrad;
      ctx.beginPath();
      ctx.moveTo(-44, -36);
      ctx.bezierCurveTo(20, -50, 50, -22, 50, 0);
      ctx.bezierCurveTo(50, 22, 20, 50, -44, 36);
      ctx.bezierCurveTo(-26, 18, -26, -18, -44, -36);
      ctx.closePath();
      ctx.fill();

      // 內部果肉
      const pulpGrad = ctx.createRadialGradient(-8, -6, 6, 0, 0, 36);
      pulpGrad.addColorStop(0, "#ffe5a8");
      pulpGrad.addColorStop(0.55, "#ffcc66");
      pulpGrad.addColorStop(1, "#d88a1a");
      ctx.fillStyle = pulpGrad;
      ctx.beginPath();
      ctx.moveTo(-32, -28);
      ctx.bezierCurveTo(14, -38, 38, -16, 38, 0);
      ctx.bezierCurveTo(38, 16, 14, 38, -32, 28);
      ctx.bezierCurveTo(-18, 12, -18, -12, -32, -28);
      ctx.closePath();
      ctx.fill();

      // 果粒紋理（小顆白色斑點代表 juice sacs）
      ctx.fillStyle = "rgba(255, 245, 200, 0.65)";
      for (let i = 0; i < 14; i++) {
        const angle = (i / 14) * Math.PI * 2;
        const r = 8 + (i % 3) * 6;
        ctx.beginPath();
        ctx.ellipse(Math.cos(angle) * r * 0.6 - 4, Math.sin(angle) * r * 0.5, 1.5, 2.2, angle, 0, Math.PI * 2);
        ctx.fill();
      }

      // 中央白色心
      ctx.fillStyle = "rgba(255,240,210,0.85)";
      ctx.beginPath();
      ctx.ellipse(-12, 0, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.ellipse(-10, -18, 12, 8, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      ctx.restore();
    }

    function drawCarrotSlice(x, y, scale = 1, rotate = 0) {
      // 紅蘿蔔切片：圓盤狀，有外圈深橘 + 內芯亮黃 + 中央深色點
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotate);
      ctx.scale(scale, scale);

      // 外圈（深橘色皮層）
      const ringGrad = ctx.createRadialGradient(-6, -8, 4, 0, 0, 34);
      ringGrad.addColorStop(0, "#ffb74d");
      ringGrad.addColorStop(0.65, "#ef6c00");
      ringGrad.addColorStop(1, "#8b3a00");
      ctx.fillStyle = ringGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 32, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // 中層（亮橘色肉質）
      const fleshGrad = ctx.createRadialGradient(-4, -6, 3, 0, 0, 26);
      fleshGrad.addColorStop(0, "#ffe0a8");
      fleshGrad.addColorStop(0.6, "#ffb74d");
      fleshGrad.addColorStop(1, "#e6822a");
      ctx.fillStyle = fleshGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 25, 21, 0, 0, Math.PI * 2);
      ctx.fill();

      // 內芯（淺黃色，紅蘿蔔的木質部）
      const coreGrad = ctx.createRadialGradient(-2, -3, 1, 0, 0, 12);
      coreGrad.addColorStop(0, "#fff5b0");
      coreGrad.addColorStop(1, "#e0a040");
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // 環狀放射紋
      ctx.strokeStyle = "rgba(180, 80, 0, 0.35)";
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 9);
        ctx.lineTo(Math.cos(a) * 22, Math.sin(a) * 18);
        ctx.stroke();
      }

      // 高光
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.ellipse(-10, -10, 10, 6, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      ctx.restore();
    }

    function drawSoupBowl(x, y, scale = 1, soupColor = "#ffb74d") {
      if (drawEnvironmentSprite("soupBowl", x, y - 8 * scale, 198 * scale, 188 * scale)) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = 0.84;
        ctx.fillStyle = soupColor;
        ctx.beginPath();
        ctx.ellipse(0, -2, 72, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // 把所有的水果片都漂在湯面上
        drawBowlPieces();
        ctx.restore();
        drawSteamDrift(x, y - 38 * scale, scale * 0.74, 1.1);
        return;
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(0, 0, 96, 38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = soupColor;
      ctx.beginPath();
      ctx.ellipse(0, -4, 72, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      drawBowlPieces();
      ctx.fillStyle = "#42a5f5";
      ctx.beginPath();
      ctx.moveTo(-82, 8);
      ctx.quadraticCurveTo(-62, 82, 0, 88);
      ctx.quadraticCurveTo(62, 82, 82, 8);
      ctx.closePath();
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        const sx = -34 + i * 34;
        ctx.moveTo(sx, -72);
        ctx.quadraticCurveTo(sx - 18, -50, sx, -28);
        ctx.stroke();
      }
      ctx.restore();
      drawSteamDrift(x, y - 38 * scale, scale * 0.74, 1.1);
    }

    // 把所有水果切片漂浮在湯碗湯面上（畫在已 translate/scale 的 ctx 中）
    function drawBowlPieces() {
      const layout = [
        { x: -34, y: -6, scale: 0.42, rot: -0.4 },
        { x: 8,   y: -2, scale: 0.45, rot: 0.15 },
        { x: 38,  y: -8, scale: 0.40, rot: -0.2 },
        { x: -10, y: 6,  scale: 0.38, rot: 0.5 }
      ];
      const bob = state.time * 1.6;
      layout.forEach((s, i) => {
        const dy = Math.sin(bob + i * 0.9) * 1.5;
        // 切片下半部被湯水蓋住的薄霧（在切片之前先畫，模擬部分沉入湯中）
        drawFruitSlice(state.fruit.id, s.x, s.y + dy, s.scale, s.rot + Math.sin(bob * 0.5 + i) * 0.06);
        ctx.fillStyle = hexWithAlpha(state.fruit.soupColor, 0.32);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y + dy + 4 * s.scale, 28 * s.scale, 6 * s.scale, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawSticker(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(state.time * 3) * 0.06);
      roundRect(-66, -68, 132, 136, 8, "#fff8e1");
      ctx.strokeStyle = "#ffca28";
      ctx.lineWidth = 7;
      ctx.strokeRect(-56, -58, 112, 116);
      drawFruit(state.fruit.id, 0, -8, 34, 1);
      ctx.fillStyle = "#5d4037";
      ctx.font = "800 22px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("貼紙", 0, 48);
      drawStickerSparkles(0, 0, 1);
      ctx.restore();
    }

    function drawStickerBookPreview(x, y) {
      roundRect(x, y, 214, 96, 8, "#fff8e1");
      ctx.strokeStyle = "#8d6e63";
      ctx.lineWidth = 4;
      ctx.strokeRect(x + 8, y + 8, 198, 80);
      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 20px system-ui";
      ctx.fillText("貼紙書", x + 107, y + 24);

      const previewStep = FRUITS.length > 1 ? 144 / (FRUITS.length - 1) : 0;
      FRUITS.forEach((fruit, index) => {
        const sx = x + 35 + index * previewStep;
        const sy = y + 58;
        const count = stickerCount(fruit.id);
        roundRect(sx - 18, sy - 20, 36, 40, 6, count > 0 ? "#ffffff" : "#d7ccc8");
        if (count > 0) {
          drawFruit(fruit.id, sx, sy - 2, 13, 1);
          drawStars(sx, sy + 22, stickerStars(fruit.id), 6);
        } else {
          ctx.fillStyle = "#a1887f";
          ctx.font = "900 18px system-ui";
          ctx.fillText("?", sx, sy);
        }
      });
    }

    function drawStars(x, y, count, size = 14) {
      for (let i = 0; i < 3; i++) {
        const sx = x + (i - 1) * size * 1.25;
        drawStar(sx, y, size * 0.5, i < count ? "#ffca28" : "#d7ccc8");
      }
    }

    function drawStar(x, y, r, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, r * 0.18);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? r : r * 0.45;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawSpeech(x, y, w, h, line1, line2) {
      roundRect(x, y, w, h, 18, "#ffffff");
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(x + 54, y + h - 2);
      ctx.lineTo(x + 20, y + h + 36);
      ctx.lineTo(x + 106, y + h - 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 28px system-ui";
      ctx.fillText(line1, x + w / 2, y + h * 0.35);
      ctx.font = "900 34px system-ui";
      ctx.fillText(line2, x + w / 2, y + h * 0.68);
    }

    function drawButton(rect, label, color) {
      roundRect(rect.x, rect.y, rect.w, rect.h, 8, "#5d4037");
      roundRect(rect.x + 6, rect.y + 6, rect.w - 12, rect.h - 12, 8, color);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 30px system-ui";
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    }

    function drawProgress(x, y, w, value, color) {
      roundRect(x, y, w, 26, 8, "#ffffff");
      roundRect(x + 4, y + 4, Math.max(8, (w - 8) * value), 18, 7, color);
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function roundRect(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, VIEW.w, VIEW.h);
      if (state.mode === "menu") drawTitle();
      if (state.mode === "book") drawStickerBookScreen();
      if (state.mode === "order") drawOrder();
      if (state.mode === "wash") drawWash();
      if (state.mode === "cut") drawCut();
      if (state.mode === "cook") drawCook();
      if (state.mode === "stir") drawStir();
      if (state.mode === "reward") drawReward();
      drawParticles();
    }

    function renderGameToText() {
      const center = potCenter();
      const payload = {
        coordinateSystem: "Canvas coordinates, origin top-left, x right, y down, size 960x540.",
        mode: state.mode,
        message: state.message,
        fruit: { id: state.fruit.id, name: state.fruit.name, soupName: state.fruit.soupName, soupColor: state.fruit.soupColor },
        guest: { id: state.guest.id, name: state.guest.name },
        progress: {
          wash: Number(state.wash.toFixed(2)),
          prep: Number(Math.min(1, state.cuts / 3).toFixed(2)),
          prepKind: state.fruit.prep.kind,
          cuts: Number(state.cuts.toFixed(2)),
          cutMarks: state.cutMarks.length,
          drawingStroke: state.drag?.type === "prep" || state.drag?.type === "peel",
          stir: Number(Math.min(1, state.stir.travel / (Math.PI * 4.2)).toFixed(2))
        },
        collection: FRUITS.map((fruit) => ({
          id: fruit.id,
          count: stickerCount(fruit.id),
          stars: stickerStars(fruit.id),
          collected: stickerCount(fruit.id) > 0
        })),
        interactiveTargets: {
          fruitButtons: hit.fruits.map((rect, index) => ({ ...rect, id: FRUITS[index].id, name: FRUITS[index].name })),
          orderButton: hit.order,
          apple: { x: Math.round(state.apple.x), y: Math.round(state.apple.y), r: Math.round(state.apple.r || 46) },
          pot: { x: Math.round(center.x), y: Math.round(center.y), r: 140 },
          againButton: hit.again,
          stickerBookButton: hit.book,
          backButton: hit.back,
          muteButton: hit.mute
        }
      };
      return JSON.stringify(payload);
    }

    function loop(timestamp) {
      const next = timestamp / 1000;
      const dt = Math.min(0.033, next - (loop.last || next));
      loop.last = next;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", pointerDown);
    canvas.addEventListener("pointermove", pointerMove);
    window.addEventListener("pointerup", pointerUp);
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "f") {
        if (document.fullscreenElement) document.exitFullscreen();
        else canvas.requestFullscreen?.();
      }
    });

    window.render_game_to_text = renderGameToText;
    window.advanceTime = (ms) => {
      const steps = Math.max(1, Math.round(ms / (1000 / 60)));
      for (let i = 0; i < steps; i++) update(1 / 60);
      render();
    };

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => {
          console.info("Service worker registration failed:", error);
        });
      });
    }

    resize();
    initVoice();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

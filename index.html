<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="2-3 歲幼兒向的互動料理小遊戲">
  <meta name="theme-color" content="#ff8a65">
  <meta name="application-name" content="王國廚房">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="王國廚房">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <title>王國廚房：我的魔法平底鍋</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: #fff7d6;
      --viewport-w: 100vw;
      --viewport-h: 100vh;
      --stage-gap: 24px;
    }

    @supports (height: 100svh) {
      :root {
        --viewport-w: 100svw;
        --viewport-h: 100svh;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff7d6;
    }

    main {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    canvas {
      --stage-width: min(calc(var(--viewport-w) - var(--stage-gap)), calc((var(--viewport-h) - var(--stage-gap)) * 16 / 9));
      width: var(--stage-width);
      height: calc(var(--stage-width) * 9 / 16);
      max-width: 100%;
      max-height: 100%;
      border: 4px solid #6d4c41;
      border-radius: 8px;
      background: #fff7d6;
      touch-action: none;
      box-shadow: 0 18px 44px rgba(89, 53, 31, 0.22);
    }

    @media (orientation: portrait) {
      canvas {
        --stage-width: min(calc(var(--viewport-h) - var(--stage-gap)), calc((var(--viewport-w) - var(--stage-gap)) * 16 / 9));
        position: fixed;
        left: 50%;
        top: 50%;
        max-width: none;
        max-height: none;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="王國廚房遊戲畫面"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const portraitStage = window.matchMedia("(orientation: portrait)");
    const VIEW = { w: 960, h: 540 };
    const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const FRUITS = [
      {
        id: "apple",
        name: "蘋果",
        soupName: "蘋果魔法湯",
        color: "#ef3f38",
        soupColor: "#ffb74d",
        accent: "#ffecb3",
        prep: { kind: "slice", title: "魔法切蘋果", line1: "畫三刀", line2: "切成小塊", speech: "用手指在蘋果上畫三刀。" }
      },
      {
        id: "banana",
        name: "香蕉",
        soupName: "香蕉奶香湯",
        color: "#ffd54f",
        soupColor: "#ffe082",
        accent: "#fff59d",
        prep: { kind: "peel", title: "剝開香蕉皮", line1: "滑一滑", line2: "剝開香蕉", speech: "用手指沿著香蕉滑一滑。" }
      },
      {
        id: "strawberry",
        name: "草莓",
        soupName: "草莓甜甜湯",
        color: "#ef476f",
        soupColor: "#f48fb1",
        accent: "#ffc1cc",
        prep: { kind: "pluck", title: "摘掉小葉子", line1: "畫過葉子", line2: "摘乾淨", speech: "用手指在草莓葉子上滑一滑。" }
      },
      {
        id: "orange",
        name: "橘子",
        soupName: "橘子陽光湯",
        color: "#ff9800",
        soupColor: "#ffcc80",
        accent: "#ffe0b2",
        prep: { kind: "segment", title: "分成橘子瓣", line1: "畫三刀", line2: "分小瓣", speech: "用手指在橘子上畫三刀。" }
      },
      {
        id: "carrot",
        name: "胡蘿蔔",
        soupName: "胡蘿蔔星星湯",
        color: "#f57c00",
        soupColor: "#ffb74d",
        accent: "#ffd180",
        prep: { kind: "brush", title: "刷亮胡蘿蔔", line1: "刷一刷", line2: "變小段", speech: "用手指在胡蘿蔔上刷三下。" }
      }
    ];

    const GUESTS = [
      { id: "princess", name: "小公主", color: "#f48fb1", hat: "crown" },
      { id: "knight", name: "小騎士", color: "#90caf9", hat: "helmet" },
      { id: "wizard", name: "小魔法師", color: "#9575cd", hat: "wizard" },
      { id: "prince", name: "小王子", color: "#ffcc80", hat: "crown" }
    ];

    function loadCollection() {
      try {
        const raw = JSON.parse(localStorage.getItem("kingdomKitchenStickers") || "{}");
        const normalized = {};
        for (const fruit of FRUITS) {
          const entry = raw[fruit.id];
          if (entry === true) normalized[fruit.id] = { count: 1 };
          else if (typeof entry === "number") normalized[fruit.id] = { count: Math.max(0, entry) };
          else if (entry && typeof entry.count === "number") normalized[fruit.id] = { count: Math.max(0, entry.count) };
          else normalized[fruit.id] = { count: 0 };
        }
        return normalized;
      } catch (error) {
        return FRUITS.reduce((collection, fruit) => {
          collection[fruit.id] = { count: 0 };
          return collection;
        }, {});
      }
    }

    function saveCollection() {
      try {
        localStorage.setItem("kingdomKitchenStickers", JSON.stringify(state.collection));
      } catch (error) {
        // Storage can be unavailable in private contexts; the session collection still works.
      }
    }

    function stickerCount(fruitId) {
      return Math.max(0, state.collection[fruitId]?.count || 0);
    }

    function stickerStars(fruitId) {
      return Math.min(3, stickerCount(fruitId));
    }

    function addSticker(fruitId) {
      const entry = state.collection[fruitId] || { count: 0 };
      entry.count += 1;
      state.collection[fruitId] = entry;
      saveCollection();
      return entry.count;
    }

    const fruitSprites = {};
    for (const fruit of FRUITS) {
      const image = new Image();
      image.src = `assets/sprites/fruit/${fruit.id}.png`;
      fruitSprites[fruit.id] = image;
    }
    const prepSpriteFiles = {
      apple: "apple-slices",
      banana: "banana-peeled",
      strawberry: "strawberry-clean",
      orange: "orange-wedges",
      carrot: "carrot-pieces"
    };
    const prepSprites = {};
    for (const fruit of FRUITS) {
      const image = new Image();
      image.src = `assets/sprites/prep/${prepSpriteFiles[fruit.id]}.png`;
      prepSprites[fruit.id] = image;
    }
    const characterSpriteFiles = {
      chef: "chef",
      princess: "princess",
      knight: "knight",
      wizard: "wizard",
      prince: "prince"
    };
    const characterSprites = {};
    for (const id of Object.keys(characterSpriteFiles)) {
      const image = new Image();
      image.src = `assets/sprites/characters/${characterSpriteFiles[id]}.png`;
      characterSprites[id] = image;
    }
    const environmentSpriteFiles = {
      kitchen: "kitchen",
      pot: "pot",
      soupBowl: "soup-bowl"
    };
    const environmentSprites = {};
    for (const id of Object.keys(environmentSpriteFiles)) {
      const image = new Image();
      image.src = `assets/sprites/environment/${environmentSpriteFiles[id]}.png`;
      environmentSprites[id] = image;
    }

    const state = {
      mode: "menu",
      time: 0,
      message: "點食材開始料理",
      selectedFruitIndex: 0,
      recipeIndex: 0,
      fruit: FRUITS[0],
      guest: GUESTS[0],
      spoken: "",
      cuts: 0,
      cutFlash: 0,
      cutTrail: [],
      cutMarks: [],
      wash: 0,
      dirt: [
        { x: -28, y: -18, r: 9 },
        { x: 10, y: -28, r: 7 },
        { x: 30, y: 2, r: 8 },
        { x: -6, y: 20, r: 10 },
        { x: -36, y: 18, r: 6 }
      ],
      drag: null,
      apple: { x: 410, y: 315, r: 62 },
      pot: { x: 650, y: 292, w: 230, h: 138 },
      stir: { active: false, lastAngle: 0, travel: 0 },
      particles: [],
      // 煮的階段：把切好的水果切成多個小片，一片一片拖進鍋裡
      pieces: [],
      cookAdvancing: false,
      mute: false,
      pendingNext: false,
      rewardTime: 0,
      lastRewardCount: 0,
      collection: loadCollection()
    };

    function fruitHitRects() {
      const cardW = 112;
      const gap = 24;
      const totalW = FRUITS.length * cardW + (FRUITS.length - 1) * gap;
      const startX = (VIEW.w - totalW) / 2;
      return FRUITS.map((_, index) => ({ x: startX + index * (cardW + gap), y: 260, w: cardW, h: 124 }));
    }

    const hit = {
      fruits: fruitHitRects(),
      order: { x: 620, y: 382, w: 210, h: 70 },
      again: { x: 350, y: 392, w: 260, h: 72 },
      book: { x: 674, y: 394, w: 214, h: 96 },
      back: { x: 34, y: 34, w: 152, h: 58 },
      mute: { x: 848, y: 24, w: 74, h: 48 }
    };

    const audio = {
      ctx: null,
      beep(freq = 540, duration = 0.08, type = "sine") {
        if (state.mute) return;
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.12, this.ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration + 0.02);
        } catch (error) {
          state.mute = true;
        }
      }
    };

    function resize() {
      canvas.width = VIEW.w * DPR;
      canvas.height = VIEW.h * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    let preferredVoice = null;
    function pickVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      const isTW = (v) => /zh[-_]TW/i.test(v.lang);
      const isHK = (v) => /zh[-_]HK/i.test(v.lang);
      const isZh = (v) => /^zh(?:[-_]|$)/i.test(v.lang);
      const tiers = [
        (v) => isTW(v) && /premium/i.test(v.name),
        (v) => isTW(v) && /enhanced/i.test(v.name),
        (v) => isTW(v) && /mei[-\s]?jia|美佳|台灣|臺灣/i.test(v.name),
        (v) => isTW(v) && /google/i.test(v.name),
        (v) => isTW(v),
        (v) => isHK(v) && /premium|enhanced/i.test(v.name),
        (v) => isHK(v),
        (v) => isZh(v),
      ];
      for (const test of tiers) {
        const match = voices.find(test);
        if (match) return match;
      }
      return null;
    }
    function initVoice() {
      if (!("speechSynthesis" in window)) return;
      preferredVoice = pickVoice();
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", () => {
          preferredVoice = pickVoice() || preferredVoice;
        });
      }
    }

    function speak(text) {
      if (state.mute || state.spoken === text || !("speechSynthesis" in window)) return;
      state.spoken = text;
      try {
        window.speechSynthesis.cancel();
        if (!preferredVoice) preferredVoice = pickVoice();
        const utterance = new SpeechSynthesisUtterance(text);
        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.lang = preferredVoice?.lang || "zh-TW";
        utterance.rate = 0.95;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
      } catch (error) {
        state.mute = true;
      }
    }

    function selectFruit(index) {
      state.selectedFruitIndex = index;
      state.recipeIndex = index;
      state.fruit = FRUITS[index];
      state.message = `今天做${state.fruit.soupName}`;
    }

    function resetRound(index = state.selectedFruitIndex) {
      state.selectedFruitIndex = index;
      state.recipeIndex = index;
      state.fruit = FRUITS[state.recipeIndex];
      state.guest = GUESTS[(index + stickerCount(state.fruit.id)) % GUESTS.length];
      state.mode = "order";
      state.message = `${state.guest.name}想喝${state.fruit.soupName}`;
      state.cuts = 0;
      state.cutFlash = 0;
      state.cutTrail = [];
      state.cutMarks = [];
      state.wash = 0;
      state.apple = { x: 410, y: 315, r: 62 };
      state.drag = null;
      state.stir = { active: false, lastAngle: 0, travel: 0 };
      state.particles = [];
      state.pendingNext = false;
      state.rewardTime = 0;
      state.lastRewardCount = 0;
      state.spoken = "";
      speak(`${state.guest.name}想喝${state.fruit.soupName}。`);
    }

    function returnToMenu() {
      state.mode = "menu";
      state.message = `選${state.fruit.name}或換一個食材`;
      state.drag = null;
      state.cutTrail = [];
      state.cutMarks = [];
      state.stir.active = false;
      state.pendingNext = false;
      state.spoken = "";
    }

    function setMode(mode, message) {
      state.mode = mode;
      state.message = message;
      state.drag = null;
      state.cutTrail = [];
      state.stir.active = false;
      state.pendingNext = false;
      state.cookAdvancing = false;
      if (mode === "cut") state.cutMarks = [];
      if (mode === "cook") initCookPieces();
      if (mode === "wash") speak(`幫${state.fruit.name}洗一洗。`);
      if (mode === "cut") speak(state.fruit.prep.speech);
      if (mode === "cook") speak(`把切好的${state.fruit.name}一片一片放進鍋鍋裡。`);
      if (mode === "stir") speak("繞圈圈攪一攪。");
      if (mode === "reward") {
        state.rewardTime = 0;
        state.lastRewardCount = addSticker(state.fruit.id);
        speak("完成了，好香喔。貼紙到手。");
      }
    }

    // 把切好的水果初始化為 4 個獨立的小片，整齊排在砧板/檯面上
    function initCookPieces() {
      state.pieces = [];
      const count = 4;
      const trayY = 320;
      const startX = 220;
      const gap = 78;
      const rotations = [-0.25, -0.1, 0.12, 0.28];
      for (let i = 0; i < count; i++) {
        const baseX = startX + i * gap;
        state.pieces.push({
          id: i,
          x: baseX,
          y: trayY + Math.sin(i) * 4,
          baseX,
          baseY: trayY + Math.sin(i) * 4,
          rotation: rotations[i] || 0,
          baseRotation: rotations[i] || 0,
          scale: 0.9 + (i % 2) * 0.05,
          inPot: false,
          dragging: false,
          // 落到鍋裡之後的位置（散落分布）
          potOffsetX: (Math.random() - 0.5) * 70,
          potOffsetY: (Math.random() - 0.5) * 14,
          potRotation: (Math.random() - 0.5) * 0.6,
          dropAnim: 0
        });
      }
    }

    function finishPrep() {
      if (state.pendingNext) return;
      state.pendingNext = true;
      state.cuts = 3;
      state.cutTrail = [];
      spawnBurst(state.apple.x, state.apple.y - 20, state.fruit.accent, 28);
      audio.beep(820, 0.14, "triangle");
      setTimeout(() => {
        if (state.mode === "cut") setMode("cook", `把${state.fruit.name}放進鍋鍋`);
      }, 650);
    }

    function posFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      if (portraitStage.matches) {
        return {
          x: (event.clientY - rect.top) * VIEW.w / rect.height,
          y: (rect.right - event.clientX) * VIEW.h / rect.width
        };
      }
      return {
        x: (event.clientX - rect.left) * VIEW.w / rect.width,
        y: (event.clientY - rect.top) * VIEW.h / rect.height
      };
    }

    function inRect(point, rect) {
      return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function beginPrepGesture(point) {
      state.drag = {
        type: state.fruit.prep.kind === "peel" ? "peel" : "prep",
        start: point,
        last: point,
        path: [point],
        length: 0,
        maxDistance: 0
      };
      state.cutTrail = [point];
      state.cutFlash = 0.12;
    }

    function trackPrepGesture(point) {
      if (!state.drag || (state.drag.type !== "prep" && state.drag.type !== "peel")) return 0;
      const moved = dist(point, state.drag.last);
      state.drag.length += moved;
      state.drag.maxDistance = Math.max(state.drag.maxDistance, dist(point, state.drag.start));
      state.drag.last = point;
      state.drag.path.push(point);
      if (state.drag.path.length > 18) state.drag.path.shift();
      state.cutTrail = state.drag.path.slice();
      if (moved > 1) state.cutFlash = 0.18;
      return moved;
    }

    function completePrepGesture() {
      if (!state.drag || state.drag.type !== "prep") return;
      const gesture = state.drag;
      const end = gesture.last;
      const validStroke = gesture.length >= 56 && gesture.maxDistance >= 46 && dist(gesture.start, state.apple) < 135;
      if (!validStroke) {
        audio.beep(240, 0.06, "sine");
        state.cutTrail = [];
        return;
      }

      state.cuts = Math.min(3, Math.floor(state.cuts) + 1);
      state.cutFlash = 0.24;
      const mark = {
        start: { x: gesture.start.x, y: gesture.start.y },
        end: { x: end.x, y: end.y },
        color: state.fruit.accent
      };
      state.cutMarks.push(mark);
      if (state.cutMarks.length > 3) state.cutMarks.shift();
      spawnBurst((mark.start.x + mark.end.x) / 2, (mark.start.y + mark.end.y) / 2, state.fruit.accent, 14);
      audio.beep(760 + state.cuts * 70, 0.08, "triangle");
      state.cutTrail = [];
      if (state.cuts >= 3) finishPrep();
    }

    function spawnBurst(x, y, color = "#ffd54f", count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 170;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 45,
          life: 0.5 + Math.random() * 0.45,
          color,
          size: 4 + Math.random() * 6
        });
      }
    }

    function pointerDown(event) {
      const point = posFromEvent(event);
      if (inRect(point, hit.mute)) {
        state.mute = !state.mute;
        if (state.mute && "speechSynthesis" in window) window.speechSynthesis.cancel();
        return;
      }

      if (state.mode === "menu") {
        if (inRect(point, hit.book)) {
          state.mode = "book";
          state.message = "我的貼紙書";
          state.drag = null;
          audio.beep(620, 0.08, "triangle");
          return;
        }

        const fruitIndex = hit.fruits.findIndex((rect) => inRect(point, rect));
        if (fruitIndex >= 0) {
          selectFruit(fruitIndex);
          audio.beep(520 + fruitIndex * 70, 0.07, "triangle");
          resetRound(fruitIndex);
          return;
        }
        return;
      }

      if (state.mode === "book" && inRect(point, hit.back)) {
        audio.beep(500, 0.07, "triangle");
        returnToMenu();
        return;
      }

      if (state.mode === "order" && inRect(point, hit.order)) {
        audio.beep(640);
        setMode("wash", `把${state.fruit.name}洗乾淨`);
        return;
      }

      if (state.mode === "wash" && dist(point, state.apple) < 95) {
        state.drag = { type: "wash", last: point };
        audio.beep(420, 0.06, "triangle");
        return;
      }

      if (state.mode === "cut" && dist(point, state.apple) < 130) {
        beginPrepGesture(point);
        audio.beep(state.fruit.prep.kind === "peel" ? 520 : 610, 0.06, "triangle");
        return;
      }

      if (state.mode === "cook") {
        // 從後往前檢查（最上層的優先）
        for (let i = state.pieces.length - 1; i >= 0; i--) {
          const p = state.pieces[i];
          if (p.inPot) continue;
          if (dist(point, p) < 46) {
            state.drag = {
              type: "piece",
              index: i,
              dx: p.x - point.x,
              dy: p.y - point.y
            };
            p.dragging = true;
            // 把這片放到陣列最上層渲染
            state.pieces.splice(i, 1);
            state.pieces.push(p);
            audio.beep(480 + i * 40, 0.05);
            return;
          }
        }
        return;
      }

      if (state.mode === "stir") {
        const center = potCenter();
        if (dist(point, center) < 145) {
          state.stir.active = true;
          state.stir.lastAngle = Math.atan2(point.y - center.y, point.x - center.x);
          audio.beep(430, 0.05, "triangle");
        }
        return;
      }

      if (state.mode === "reward" && inRect(point, hit.again)) {
        audio.beep(660);
        returnToMenu();
      }
    }

    function pointerMove(event) {
      const point = posFromEvent(event);
      if (state.mode === "wash" && state.drag?.type === "wash") {
        const moved = dist(point, state.drag.last);
        if (dist(point, state.apple) < 105) {
          state.wash = Math.min(1, state.wash + moved / 360);
          if (moved > 2) spawnBurst(point.x, point.y, "#81d4fa", 1);
          if (state.wash >= 1) {
            spawnBurst(state.apple.x, state.apple.y, "#4fc3f7", 22);
            audio.beep(720, 0.12);
            setTimeout(() => setMode("cut", state.fruit.prep.title), 240);
          }
        }
        state.drag.last = point;
        return;
      }

      if (state.mode === "cut" && state.drag?.type === "peel") {
        const moved = trackPrepGesture(point);
        if (dist(point, state.apple) < 130) {
          state.cuts = Math.min(3, state.cuts + moved / 64);
          state.cutFlash = 0.18;
          if (moved > 2) spawnBurst(point.x, point.y, state.fruit.accent, 1);
          if (state.cuts >= 3) finishPrep();
        }
        return;
      }

      if (state.mode === "cut" && state.drag?.type === "prep") {
        const moved = trackPrepGesture(point);
        if (dist(point, state.apple) < 150 && moved > 3) {
          spawnBurst(point.x, point.y, state.fruit.accent, 1);
        }
        return;
      }

      if (state.mode === "cook" && state.drag?.type === "piece") {
        const p = state.pieces[state.pieces.length - 1];
        if (p) {
          p.x = point.x + state.drag.dx;
          p.y = point.y + state.drag.dy;
          // 拖近鍋口時噴出小火花提示
          const center = potCenter();
          if (dist(p, center) < 120 && Math.random() > 0.7) {
            spawnBurst(p.x, p.y + 16, state.fruit.accent, 1);
          }
        }
        return;
      }

      if (state.mode === "stir" && state.stir.active) {
        const center = potCenter();
        const angle = Math.atan2(point.y - center.y, point.x - center.x);
        let delta = angle - state.stir.lastAngle;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        state.stir.travel += Math.abs(delta);
        state.stir.lastAngle = angle;
        if (Math.random() > 0.55) spawnBurst(point.x, point.y, "#fff176", 1);
        if (state.stir.travel >= Math.PI * 4.2) {
          spawnBurst(center.x, center.y - 35, state.fruit.accent, 34);
          audio.beep(860, 0.16, "triangle");
          setMode("reward", `${state.fruit.soupName}完成了`);
        }
      }
    }

    function pointerUp() {
      if (state.mode === "cut" && state.drag?.type === "prep") {
        completePrepGesture();
      }

      if (state.mode === "cut" && state.drag?.type === "peel") {
        state.cutTrail = [];
      }

      if (state.mode === "cook" && state.drag?.type === "piece") {
        const p = state.pieces[state.pieces.length - 1];
        if (p) {
          const center = potCenter();
          if (dist(p, center) < 130) {
            // 進鍋！
            p.inPot = true;
            p.dragging = false;
            p.dropAnim = 1; // 觸發掉落動畫
            spawnBurst(center.x, center.y - 22, state.fruit.accent, 18);
            spawnBurst(center.x, center.y - 8, state.fruit.soupColor, 10);
            audio.beep(720, 0.14, "triangle");
            // 檢查是否全部入鍋
            if (state.pieces.every((piece) => piece.inPot) && !state.cookAdvancing) {
              state.cookAdvancing = true;
              setTimeout(() => {
                if (state.mode === "cook") setMode("stir", "在鍋裡繞圈圈攪拌");
              }, 700);
            }
          } else {
            // 退回原位
            p.x = p.baseX;
            p.y = p.baseY;
            p.dragging = false;
            audio.beep(260, 0.07, "sine");
          }
        }
      }
      state.drag = null;
      state.stir.active = false;
    }

    function potCenter() {
      return { x: state.pot.x + state.pot.w / 2, y: state.pot.y + state.pot.h / 2 };
    }

    function update(dt) {
      state.time += dt;
      state.cutFlash = Math.max(0, state.cutFlash - dt);
      if (state.mode === "reward") state.rewardTime += dt;
      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 220 * dt;
        p.life -= dt;
      }
      state.particles = state.particles.filter((p) => p.life > 0);
      // 切片落鍋動畫倒數
      for (const piece of state.pieces) {
        if (piece.dropAnim > 0) piece.dropAnim = Math.max(0, piece.dropAnim - dt * 2.2);
      }
    }

    function drawFruitChoice(fruit, index, rect) {
      const cardBob = Math.sin(state.time * 2.2 + index * 0.7) * 2.4;

      // 卡片底部的柔和陰影 — 卡片越「浮起」陰影越淡且越散
      ctx.save();
      const cardShadow = ctx.createRadialGradient(
        rect.x + rect.w / 2, rect.y + rect.h + 8, 4,
        rect.x + rect.w / 2, rect.y + rect.h + 8, rect.w * 0.65
      );
      const sAlpha = 0.28 - cardBob * 0.018;
      cardShadow.addColorStop(0, `rgba(78, 52, 30, ${sAlpha})`);
      cardShadow.addColorStop(1, "rgba(78, 52, 30, 0)");
      ctx.fillStyle = cardShadow;
      ctx.beginPath();
      ctx.ellipse(rect.x + rect.w / 2, rect.y + rect.h + 10, rect.w * 0.5, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 卡片邊框 + 內白
      roundRect(rect.x, rect.y + cardBob, rect.w, rect.h, 8, "#a1887f");
      roundRect(rect.x + 6, rect.y + 6 + cardBob, rect.w - 12, rect.h - 12, 8, "#ffffff");

      // 卡片上半部加一層淡淡光澤，營造塑膠卡片的反光
      ctx.save();
      ctx.globalAlpha = 0.55;
      const gloss = ctx.createLinearGradient(0, rect.y + cardBob, 0, rect.y + cardBob + rect.h * 0.55);
      gloss.addColorStop(0, "rgba(255,255,255,0.85)");
      gloss.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gloss;
      roundRect(rect.x + 8, rect.y + 8 + cardBob, rect.w - 16, rect.h * 0.55, 8, "rgba(255,255,255,0.0)");
      ctx.fillRect(rect.x + 8, rect.y + 8 + cardBob, rect.w - 16, rect.h * 0.45);
      ctx.restore();

      // 浮動水果（每顆有獨立相位 + 輕微傾斜）
      drawFloatingFruit(
        fruit.id,
        rect.x + rect.w / 2,
        rect.y + 48 + cardBob,
        38,
        0.96,
        { bobSeed: index * 1.3, amplitude: 3.2, speed: 2.4, tilt: 0.07, glossAlpha: 0.34, shadowIntensity: 0.24 }
      );

      ctx.fillStyle = "#5d4037";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 23px system-ui";
      ctx.fillText(fruit.name, rect.x + rect.w / 2, rect.y + 98 + cardBob);
      if (stickerCount(fruit.id) > 0) {
        ctx.fillStyle = "#ffca28";
        ctx.beginPath();
        ctx.arc(rect.x + rect.w - 18, rect.y + 20 + cardBob, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 15px system-ui";
        ctx.fillText("✓", rect.x + rect.w - 18, rect.y + 21 + cardBob);
      }
    }

    function drawOrder() {
      drawKitchen();
      drawChef(210, 318, 1.22, true);

      drawSpeech(326, 150, 430, 134, `${state.guest.name}想喝`, state.fruit.soupName);
      drawFloatingFruit(state.fruit.id, 530, 354, 52, 1, { amplitude: 5, speed: 1.7, tilt: 0.08, glossAlpha: 0.38 });

    function drawWash() {
      drawWorkScene();
      drawSpeech(98, 138, 292, 92, "洗一洗", "乾乾淨淨");

      // 水槽底部
      drawWashBasin(state.apple.x, state.apple.y + 70);

      // 水柱（從上方流向水果）
      drawWaterStream(state.apple.x - 20, state.apple.y - 140, state.apple.x, state.apple.y - 12);

      // 水果本體（浮在水流中，輕微上下擺動）
      const phase = state.time * 2.2;
      const lift = Math.sin(phase) * 3;
      drawFloatShadow(state.apple.x, state.apple.y + state.apple.r * 0.6, state.apple.r, 4 + lift, 0.22);
      ctx.save();
      ctx.translate(0, lift);
      drawFruit(state.fruit.id, state.apple.x, state.apple.y, state.apple.r, 1);
      // 髒污（隨洗淨進度淡化，並逐漸縮小）
      const alpha = 1 - state.wash;
      for (const d of state.dirt) {
        ctx.globalAlpha = Math.max(0, alpha);
        const r = d.r * (0.45 + alpha * 0.55);
        // 髒污用不規則的橢圓 + 紋理感
        ctx.fillStyle = "rgba(74, 49, 28, 0.78)";
        ctx.beginPath();
        ctx.ellipse(state.apple.x + d.x, state.apple.y + d.y, r * 1.1, r * 0.85, d.r * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(120, 80, 40, 0.55)";
        ctx.beginPath();
        ctx.arc(state.apple.x + d.x - r * 0.25, state.apple.y + d.y - r * 0.25, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 濕亮反光（洗得越乾淨，水果越亮）
      drawWetSheen(state.apple.x, state.apple.y, state.apple.r, state.wash);
      ctx.restore();

      // 拖動時手指處的水花
      if (state.mode === "wash" && state.drag?.type === "wash" && state.drag.last) {
        drawWaterSplash(state.drag.last.x, state.drag.last.y);
      }

      // 飄起的肥皂泡
      drawSoapBubbles(state.apple.x, state.apple.y, state.wash);

      drawProgress(338, 438, 284, state.wash, "#4fc3f7");
    }

    function drawWashBasin(x, y) {
      ctx.save();
      // 水槽底部的水反射
      const basinGrad = ctx.createRadialGradient(x, y, 10, x, y, 160);
      basinGrad.addColorStop(0, "rgba(129, 212, 250, 0.55)");
      basinGrad.addColorStop(0.5, "rgba(129, 212, 250, 0.18)");
      basinGrad.addColorStop(1, "rgba(129, 212, 250, 0)");
      ctx.fillStyle = basinGrad;
      ctx.beginPath();
      ctx.ellipse(x, y, 170, 36, 0, 0, Math.PI * 2);
      ctx.fill();
      // 水面波紋
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const phase = state.time * 1.4 + i * 1.1;
        const ringR = 60 + i * 28 + Math.sin(phase) * 4;
        ctx.globalAlpha = 0.35 - i * 0.08;
        ctx.beginPath();
        ctx.ellipse(x, y, ringR, ringR * 0.22, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawWaterStream(x1, y1, x2, y2) {
      ctx.save();
      // 主水柱：透明度疊合的水流帶
      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, "rgba(179, 229, 252, 0.85)");
      grad.addColorStop(0.5, "rgba(129, 212, 250, 0.55)");
      grad.addColorStop(1, "rgba(129, 212, 250, 0.0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const sway = Math.sin(state.time * 6) * 3;
      ctx.bezierCurveTo(x1 + sway, y1 + 40, x2 - sway, y2 - 40, x2, y2);
      ctx.stroke();
      // 內層白色高光
      ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x1 + 1, y1);
      ctx.bezierCurveTo(x1 + sway, y1 + 40, x2 - sway, y2 - 40, x2 - 1, y2);
      ctx.stroke();
      // 隨機水滴沿著水柱往下流
      for (let i = 0; i < 5; i++) {
        const t = ((state.time * 1.5 + i * 0.2) % 1);
        const dx = x1 + (x2 - x1) * t + Math.sin(state.time * 8 + i) * 2;
        const dy = y1 + (y2 - y1) * t;
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.ellipse(dx, dy, 2.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawWaterSplash(x, y) {
      ctx.save();
      // 水花閃光
      ctx.fillStyle = "rgba(179, 229, 252, 0.55)";
      ctx.beginPath();
      ctx.arc(x, y, 14 + Math.sin(state.time * 18) * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      // 噴濺水滴
      const splatter = 6;
      for (let i = 0; i < splatter; i++) {
        const angle = (i / splatter) * Math.PI * 2 + state.time * 2;
        const dist = 14 + Math.sin(state.time * 10 + i) * 4;
        const px = x + Math.cos(angle) * dist;
        const py = y + Math.sin(angle) * dist;
        ctx.fillStyle = "rgba(129, 212, 250, 0.85)";
        ctx.beginPath();
        ctx.ellipse(px, py, 2, 3.5, angle, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawWetSheen(x, y, r, wash) {
      if (wash <= 0.02) return;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const alpha = Math.min(0.55, 0.18 + wash * 0.45);
      // 主反光（左上）
      const grad1 = ctx.createRadialGradient(x - r * 0.32, y - r * 0.38, r * 0.05, x - r * 0.32, y - r * 0.38, r * 0.6);
      grad1.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
      grad1.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.ellipse(x - r * 0.32, y - r * 0.38, r * 0.5, r * 0.32, -0.6, 0, Math.PI * 2);
      ctx.fill();
      // 副反光（右下）
      const grad2 = ctx.createRadialGradient(x + r * 0.28, y + r * 0.32, r * 0.05, x + r * 0.28, y + r * 0.32, r * 0.5);
      grad2.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.55})`);
      grad2.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.ellipse(x + r * 0.28, y + r * 0.32, r * 0.35, r * 0.22, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 水滴沿邊緣往下滴（洗到一半才出現）
      if (wash > 0.35) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, (wash - 0.35) * 2);
        for (let i = 0; i < 4; i++) {
          const phase = (state.time * 0.8 + i * 0.32) % 1;
          const angle = -Math.PI / 2 + (i - 1.5) * 0.4;
          const dx = x + Math.cos(angle) * r * 0.9;
          const dy = y + Math.sin(angle) * r * 0.9 + phase * (r * 0.95);
          ctx.fillStyle = "rgba(179, 229, 252, 0.85)";
          ctx.beginPath();
          ctx.ellipse(dx, dy, 2.5, 5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.7)";
          ctx.beginPath();
          ctx.arc(dx - 0.5, dy - 1.5, 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawSoapBubbles(x, y, wash) {
      // 越洗越多泡泡
      const count = 4 + Math.floor(wash * 6);
      ctx.save();
      for (let i = 0; i < count; i++) {
        const phase = state.time * 0.9 + i * 0.7;
        const offsetX = Math.sin(phase + i) * 50;
        const offsetY = -((phase * 18) % 130);
        const bx = x + offsetX + (i - count / 2) * 9;
        const by = y + 30 + offsetY;
        const r = 6 + (i % 3) * 3 + Math.sin(phase * 2) * 1.2;
        const alpha = Math.max(0, 0.5 - Math.abs(offsetY) / 180);

        // 泡泡主體（半透明藍白漸層球）
        ctx.globalAlpha = alpha;
        const grad = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.1, bx, by, r);
        grad.addColorStop(0, "rgba(255,255,255,0.95)");
        grad.addColorStop(0.4, "rgba(179, 229, 252, 0.4)");
        grad.addColorStop(1, "rgba(129, 212, 250, 0.12)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();
        // 泡泡邊
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.stroke();
        // 泡泡上的小亮點
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.beginPath();
        ctx.arc(bx - r * 0.4, by - r * 0.45, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawCut() {
      drawWorkScene();
      drawSpeech(98, 138, 292, 92, state.fruit.prep.line1, state.fruit.prep.line2);
      drawCuttingBoard(326, 260, 260, 132);
      drawPrepStage(state.apple.x, state.apple.y, state.cuts);
      // 切好的水果片下方加上柔和陰影，讓切片看起來有厚度
      if (state.cuts >= 2.95) {
        drawSliceShadowsRow(state.apple.x, state.apple.y);
      }
      if (state.cuts < 2.95) {
        drawCutMarks();
        drawCutTrail();
        // 沿著手指拖動軌跡灑出果汁
        if (state.drag?.type === "prep" || state.drag?.type === "peel") {
          drawJuiceTrailSparkle();
        }
        drawMagicWand(state.apple.x + 88, state.apple.y - 88 + (state.cutFlash > 0 ? 28 : Math.sin(state.time * 5) * 5), state.cutFlash);
      }
      drawProgress(338, 438, 284, state.cuts / 3, state.fruit.accent);
    }

    function drawSliceShadowsRow(x, y) {
      ctx.save();
      ctx.fillStyle = "rgba(70, 45, 25, 0.22)";
      ctx.beginPath();
      ctx.ellipse(x, y + 56, 110, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawJuiceTrailSparkle() {
      if (state.cutTrail.length < 2) return;
      const tip = state.cutTrail[state.cutTrail.length - 1];
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // 沿著刀痕點綴小亮光
      for (let i = 0; i < 4; i++) {
        const idx = Math.max(0, state.cutTrail.length - 1 - i * 2);
        const p = state.cutTrail[idx];
        if (!p) continue;
        const r = 6 - i * 1.2 + Math.sin(state.time * 12 + i) * 1.5;
        ctx.globalAlpha = 0.55 - i * 0.1;
        ctx.fillStyle = state.fruit.accent;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      // 刀尖噴出的果汁滴
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
        const dist = 6 + i * 4 + Math.sin(state.time * 14 + i) * 2;
        const px = tip.x + Math.cos(angle) * dist;
        const py = tip.y + Math.sin(angle) * dist - 2;
        ctx.fillStyle = state.fruit.color;
        ctx.globalAlpha = 0.85 - i * 0.2;
        ctx.beginPath();
        ctx.ellipse(px, py, 2.2, 3.4, angle, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawCutMarks() {
      if (!state.cutMarks.length) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      state.cutMarks.forEach((mark, index) => {
        const isLatest = index === state.cutMarks.length - 1;
        // 外層深色陰影（切口陰影）
        ctx.strokeStyle = "rgba(63, 38, 22, 0.45)";
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(mark.start.x, mark.start.y);
        ctx.lineTo(mark.end.x, mark.end.y);
        ctx.stroke();

        // 中層：果汁色（用切的水果的 accent 顏色）
        ctx.strokeStyle = mark.color || state.fruit.accent;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(mark.start.x, mark.start.y);
        ctx.lineTo(mark.end.x, mark.end.y);
        ctx.stroke();

        // 內層：刀光白
        ctx.globalAlpha = 1;
        ctx.strokeStyle = isLatest ? "rgba(255,255,255,0.98)" : "rgba(255,255,255,0.78)";
        ctx.lineWidth = isLatest ? 5 : 4;
        ctx.beginPath();
        ctx.moveTo(mark.start.x, mark.start.y);
        ctx.lineTo(mark.end.x, mark.end.y);
        ctx.stroke();

        // 最新刀痕加上閃光效果
        if (isLatest) {
          const flash = Math.max(0, state.cutFlash);
          if (flash > 0) {
            ctx.globalAlpha = flash * 5;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(mark.start.x, mark.start.y);
            ctx.lineTo(mark.end.x, mark.end.y);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      });
      ctx.restore();
    }

    function drawCutTrail() {
      if (state.cutTrail.length < 2) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // 外層淡光暈（讓刀光看起來有立體 glow）
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.moveTo(state.cutTrail[0].x, state.cutTrail[0].y);
      for (const point of state.cutTrail.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.stroke();

      ctx.globalCompositeOperation = "source-over";

      // 主刀光
      ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(state.cutTrail[0].x, state.cutTrail[0].y);
      for (const point of state.cutTrail.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.stroke();

      // 果汁色內芯
      ctx.strokeStyle = state.fruit.accent;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(state.cutTrail[0].x, state.cutTrail[0].y);
      for (const point of state.cutTrail.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.stroke();

      // 刀尖球體 + 光暈
      const tip = state.cutTrail[state.cutTrail.length - 1];
      const pulse = Math.sin(state.time * 16) * 2;
      ctx.globalCompositeOperation = "lighter";
      const tipGrad = ctx.createRadialGradient(tip.x, tip.y, 1, tip.x, tip.y, 18 + pulse);
      tipGrad.addColorStop(0, "rgba(255,255,255,0.95)");
      tipGrad.addColorStop(0.4, `${hexWithAlpha(state.fruit.accent, 0.6)}`);
      tipGrad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = tipGrad;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 18 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#fffde7";
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 8 + pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 將 hex 顏色加上 alpha，回傳 rgba(...) 字串
    function hexWithAlpha(hex, alpha) {
      const h = hex.replace("#", "");
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawCook() {
      drawWorkScene();
      drawSpeech(76, 138, 330, 92, "一片一片", "放進鍋鍋");

      // 砧板（左邊放著切好的水果片）
      drawCuttingBoard(176, 350, 360, 96);

      // 鍋子底下的暖光暈（火光透出來）
      drawStoveGlow(state.pot.x + 115, state.pot.y + 140);

      drawPot(state.pot.x, state.pot.y, 1, state.fruit.soupColor);

      const center = potCenter();
      // 湯面上的咕嘟咕嘟泡泡
      drawSoupBoilBubbles(center.x, center.y - 8, 1, state.fruit.soupColor);

      // 蒸氣
      drawRichSteam(center.x, center.y - 30, 1, 1);

      // 進度提示：還剩幾片
      const remaining = state.pieces.filter((p) => !p.inPot).length;
      const total = state.pieces.length;
      drawProgress(338, 458, 284, total === 0 ? 0 : (total - remaining) / total, state.fruit.accent);

      // 鍋口的拖放提示圓圈（只有還有水果片在外面時才顯示）
      if (remaining > 0) {
        ctx.save();
        ctx.strokeStyle = "rgba(255, 213, 79, 0.82)";
        ctx.lineWidth = 5;
        ctx.setLineDash([14, 12]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, 124 + Math.sin(state.time * 4) * 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      // 先畫進鍋裡的水果片（在湯面內）
      drawPiecesInPot();

      // 再畫檯面上還沒進鍋的水果片
      drawPiecesOnTray();

      // 拖動中的水果靠近鍋口時，畫漣漪
      const dragPiece = state.drag?.type === "piece" ? state.pieces[state.pieces.length - 1] : null;
      if (dragPiece && !dragPiece.inPot) {
        const d = dist(dragPiece, center);
        if (d < 160) drawDropRipples(center.x, center.y - 6, 1 - d / 160);
      }
    }

    // 畫檯面上還沒進鍋的水果片：每片有自己的浮動 + 陰影
    function drawPiecesOnTray() {
      const t = state.time;
      for (const p of state.pieces) {
        if (p.inPot) continue;
        const bob = p.dragging ? 0 : Math.sin(t * 2.4 + p.id) * 2;
        // 陰影
        drawFloatShadow(p.x, p.y + 38, 32 * p.scale, 6 + (p.dragging ? 12 : bob), 0.28);
        // 切片本體
        drawFruitSlice(state.fruit.id, p.x, p.y + bob, p.scale, p.rotation);
      }
    }

    // 畫已進鍋的水果片：浸在湯面內，會輕微擺動
    function drawPiecesInPot() {
      const center = potCenter();
      const t = state.time;
      // 收集進鍋的片，依 y 排序讓後面的在後面
      const inPot = state.pieces.filter((p) => p.inPot);
      // clip 在鍋的湯面範圍內，避免畫出鍋邊
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(center.x, center.y - 6, 92, 28, 0, 0, Math.PI * 2);
      ctx.clip();
      for (const p of inPot) {
        const drift = Math.sin(t * 1.8 + p.id) * 4;
        const sway = Math.cos(t * 1.4 + p.id * 0.7) * 2;
        const px = center.x + p.potOffsetX + drift;
        const py = center.y + p.potOffsetY + sway;
        // 落入時的小波紋（dropAnim 計時）
        const scale = 0.55 + (p.dropAnim > 0 ? 0.05 * Math.sin(p.dropAnim * 8) : 0);
        ctx.save();
        ctx.globalAlpha = 0.92;
        drawFruitSlice(state.fruit.id, px, py, scale, p.potRotation + sway * 0.1);
        ctx.restore();
        // 湯水蓋過切片的薄霧
        ctx.fillStyle = `${hexWithAlpha(state.fruit.soupColor, 0.3)}`;
        ctx.beginPath();
        ctx.ellipse(px, py - 2, 32 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawStir() {
      drawWorkScene();
      drawSpeech(70, 138, 336, 92, "繞圈圈", "攪一攪");

      drawStoveGlow(state.pot.x + 115, state.pot.y + 140, 1.1);
      drawPot(state.pot.x, state.pot.y, 1.08, state.fruit.soupColor);

      const center = potCenter();
      // 湯面漩渦
      drawSoupVortex(center.x, center.y - 10, state.fruit.soupColor);

      // 把所有水果片畫在湯面內、隨漩渦旋轉
      drawPiecesStirring(center.x, center.y - 6);

      ctx.save();
      ctx.strokeStyle = "#fff59d";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(center.x, center.y - 10, 58, state.time * 2, state.time * 2 + Math.PI * 1.35);

    }

    // 水果片在湯裡跟著漩渦轉
    function drawPiecesStirring(cx, cy) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, 92, 28, 0, 0, Math.PI * 2);
      ctx.clip();
      const pieces = state.pieces.length > 0 ? state.pieces : [
        // 沒有 piece 資料時（直接進入 stir 模式測試）退而求其次
        { id: 0, potRotation: 0 }, { id: 1, potRotation: 0.3 },
        { id: 2, potRotation: -0.2 }, { id: 3, potRotation: 0.5 }
      ];
      const spin = state.time * 1.6;
      pieces.forEach((p, i) => {
        const angle = spin + (i / pieces.length) * Math.PI * 2;
        const r = 40 + (i % 2) * 14;
        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r * 0.32;
        ctx.save();
        ctx.globalAlpha = 0.92;
        drawFruitSlice(state.fruit.id, px, py, 0.5, angle + (p.potRotation || 0));
        ctx.restore();
        // 湯薄霧蓋過切片
        ctx.fillStyle = hexWithAlpha(state.fruit.soupColor, 0.32);
        ctx.beginPath();
        ctx.ellipse(px, py - 1, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawStoveGlow(x, y, scale = 1) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const pulse = 0.8 + Math.sin(state.time * 3.5) * 0.2;
      const grad = ctx.createRadialGradient(x, y, 8, x, y, 130 * scale);
      grad.addColorStop(0, `rgba(255, 167, 38, ${0.55 * pulse})`);
      grad.addColorStop(0.45, `rgba(239, 108, 0, ${0.22 * pulse})`);
      grad.addColorStop(1, "rgba(239, 108, 0, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x, y, 130 * scale, 36 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSoupBoilBubbles(x, y, scale = 1, soupColor = "#ffcc80") {
      ctx.save();
      const surfaceW = 70 * scale;
      const surfaceH = 14 * scale;
      const bubbleCount = 8;
      for (let i = 0; i < bubbleCount; i++) {
        // 每顆泡泡以不同節奏出現
        const phase = (state.time * 1.6 + i * 0.83) % 1.6;
        const t = phase / 1.6;
        if (t < 0.05 || t > 0.95) continue;
        const offsetAngle = i * 1.7 + state.time * 0.3;
        const px = x + Math.cos(offsetAngle) * surfaceW * 0.7;
        const py = y - surfaceH * 0.2 + Math.sin(offsetAngle) * surfaceH * 0.4;
        const r = (2 + i % 3) * scale * (0.4 + t);
        const alpha = Math.sin(t * Math.PI) * 0.85;
        // 泡泡：半透明球
        ctx.globalAlpha = alpha;
        const grad = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
        grad.addColorStop(0, "rgba(255,255,255,0.95)");
        grad.addColorStop(0.5, hexWithAlpha(soupColor, 0.6));
        grad.addColorStop(1, hexWithAlpha(soupColor, 0.0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawRichSteam(x, y, scale = 1, drift = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalCompositeOperation = "lighter";
      // 多層次雲團狀蒸氣
      for (let layer = 0; layer < 4; layer++) {
        const phase = state.time * (1.2 + layer * 0.18) + drift + layer * 0.9;
        const sx = (layer - 1.5) * 18 + Math.sin(phase) * 8;
        const lift = -Math.abs(((phase * 16) % 90));
        const sy = lift - 6;
        const r = 22 - layer * 2 + Math.sin(phase) * 3;
        const alpha = Math.max(0, 0.32 + lift / 240);
        ctx.globalAlpha = alpha;
        const grad = ctx.createRadialGradient(sx, sy, r * 0.1, sx, sy, r);
        grad.addColorStop(0, "rgba(255,255,255,0.85)");
        grad.addColorStop(0.55, "rgba(255,255,255,0.32)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawDropRipples(x, y, strength) {
      ctx.save();
      ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const phase = (state.time * 1.8 + i * 0.33) % 1;
        const r = 20 + phase * 70;
        ctx.globalAlpha = (1 - phase) * 0.6 * strength;
        ctx.strokeStyle = "rgba(255, 245, 157, 0.85)";
        ctx.lineWidth = 3 - phase * 2;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.22, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawSoupVortex(x, y, soupColor = "#ffcc80") {
      ctx.save();
      ctx.translate(x, y);
      // 漩渦本體：旋轉的色彩環
      ctx.rotate(state.time * 1.4);
      for (let i = 0; i < 4; i++) {
        const a0 = (i / 4) * Math.PI * 2;
        const a1 = a0 + Math.PI * 0.4;
        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, 70);
        grad.addColorStop(0, hexWithAlpha(soupColor, 0.7));
        grad.addColorStop(1, hexWithAlpha(soupColor, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 64, a0, a1);
        ctx.closePath();
        ctx.fill();
      }
      // 中心高光
      ctx.rotate(-state.time * 1.4);
      const cgrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
      cgrad.addColorStop(0, "rgba(255,255,255,0.65)");
      cgrad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = cgrad;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawGuest(x, y, scale = 1, guest = GUESTS[0], happy = false) {
